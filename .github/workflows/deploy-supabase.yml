# PHAROS — apply database migrations and deploy the Edge Functions after "PHAROS CI" has passed on a push
# to main (every tested commit: the steps are safe to repeat). Never from another branch: a run started by hand works on main only.
# It also copies the secrets the owner pasted into GitHub into the places that need them
# (Supabase function secrets, Supabase Vault) and points the Telegram webhook at the function, so every
# secret is pasted in exactly one place. No message is ever sent by this workflow.
name: PHAROS deploy Supabase

on:
  workflow_run:
    workflows: ["PHAROS CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    # A manual run: main only. Otherwise: CI passed on a push to main in this repository.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Secrets are given to the steps that use them, never to the job (so the setup action never sees them).
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      # The commit CI tested, against its first parent (the whole pull request for a merge commit).
      # A manual run always deploys.
      - name: What changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run: deploying."; echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git rev-parse -q --verify 'HEAD^1' > /dev/null; then
            echo "No parent commit: deploying."; echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only 'HEAD^1' HEAD)"
          echo "$files"
          # Always deploy: when main moves fast GitHub drops queued CI runs, so the commit that brought a
          # change may never get a deploy of its own, and the next tested commit's own diff would not show
          # it. Every step below is safe to repeat (db push applies only what is missing).
          deploy=true
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy"

      - if: steps.changes.outputs.deploy == 'true'
        uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: 3.0.0

      - name: Link the project
        if: steps.changes.outputs.deploy == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply migrations
        if: steps.changes.outputs.deploy == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes

      - name: Function secrets
        if: steps.changes.outputs.deploy == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          SITE_URL: ${{ vars.SITE_URL || 'https://pharos-satopharma.pages.dev' }}
          CONTACT_EMAIL: pharos@satopharma.com
        run: |
          umask 077
          f="$RUNNER_TEMP/fn.env"
          : > "$f"
          for n in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET TELEGRAM_WEBHOOK_SECRET \
                   GITHUB_DISPATCH_TOKEN GITHUB_REPO SITE_URL CONTACT_EMAIL; do
            v="${!n}"
            [ -n "$v" ] && printf '%s=%s\n' "$n" "$v" >> "$f"
          done
          if [ -s "$f" ]; then supabase secrets set --project-ref "$PROJECT_REF" --env-file "$f" --yes; fi
          rm -f "$f"

      - name: Deploy Edge Functions
        if: steps.changes.outputs.deploy == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy --project-ref "$PROJECT_REF" --yes

      - name: Vault secrets for the watchdog and the back-up timer
        if: steps.changes.outputs.deploy == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TOK: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}
          DISPATCH: ${{ secrets.DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "SUPABASE_DB_URL not set; skipped"; exit 0; }
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -v tok="$TOK" -v chat="$CHAT"                -v dispatch="$DISPATCH" -v repo="$REPO" <<'SQL'
          select public.ops_set_vault_secret('TELEGRAM_BOT_TOKEN', :'tok');
          select public.ops_set_vault_secret('ADMIN_TELEGRAM_CHAT_ID', :'chat');
          select public.ops_set_vault_secret('GITHUB_DISPATCH_TOKEN', :'dispatch');
          select public.ops_set_vault_secret('GITHUB_REPO', :'repo');
          SQL

      - name: Point the Telegram webhook at the function
        if: steps.changes.outputs.deploy == 'true'
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TOK: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [ -z "$TOK" ] || [ -z "$SECRET" ]; then echo "Telegram secrets not set yet; skipped"; exit 0; fi
          resp="$(curl -sS -X POST "https://api.telegram.org/bot${TOK}/setWebhook" \
            --data-urlencode "url=https://${PROJECT_REF}.supabase.co/functions/v1/telegram-webhook" \
            --data-urlencode "secret_token=${SECRET}" \
            --data-urlencode 'allowed_updates=["message"]' \
            --data-urlencode "drop_pending_updates=false")"
          echo "$resp" | grep -q '"ok":true' || { echo "setWebhook failed"; exit 1; }
          echo "Webhook set."
