# PHAROS — apply database migrations and deploy the Edge Functions on every push to main that touches
# supabase/. It also copies the secrets the owner pasted into GitHub into the places that need them
# (Supabase function secrets, Supabase Vault) and points the Telegram webhook at the function, so every
# secret is pasted in exactly one place. No message is ever sent by this workflow.
name: PHAROS deploy Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy-supabase.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2.1.2
        with:
          version: latest

      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply migrations
        run: supabase db push --linked

      - name: Function secrets
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          SITE_URL: ${{ vars.SITE_URL || 'https://pharos-satopharma.pages.dev' }}
          CONTACT_EMAIL: pharos@satopharma.com
        run: |
          umask 077
          f="$RUNNER_TEMP/fn.env"
          : > "$f"
          for n in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET TELEGRAM_WEBHOOK_SECRET \
                   GITHUB_DISPATCH_TOKEN GITHUB_REPO SITE_URL CONTACT_EMAIL; do
            v="${!n}"
            [ -n "$v" ] && printf '%s=%s\n' "$n" "$v" >> "$f"
          done
          if [ -s "$f" ]; then supabase secrets set --project-ref "$PROJECT_REF" --env-file "$f"; fi
          rm -f "$f"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      - name: Vault secrets for the watchdog
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TOK: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "SUPABASE_DB_URL not set; skipped"; exit 0; }
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -v tok="$TOK" -v chat="$CHAT" <<'SQL'
          select public.ops_set_vault_secret('TELEGRAM_BOT_TOKEN', :'tok');
          select public.ops_set_vault_secret('ADMIN_TELEGRAM_CHAT_ID', :'chat');
          SQL

      - name: Point the Telegram webhook at the function
        env:
          TOK: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [ -z "$TOK" ] || [ -z "$SECRET" ]; then echo "Telegram secrets not set yet; skipped"; exit 0; fi
          resp="$(curl -sS -X POST "https://api.telegram.org/bot${TOK}/setWebhook" \
            --data-urlencode "url=https://${PROJECT_REF}.supabase.co/functions/v1/telegram-webhook" \
            --data-urlencode "secret_token=${SECRET}" \
            --data-urlencode 'allowed_updates=["message"]' \
            --data-urlencode "drop_pending_updates=false")"
          echo "$resp" | grep -q '"ok":true' || { echo "setWebhook failed"; exit 1; }
          echo "Webhook set."
