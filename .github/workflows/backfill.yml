# PHAROS — backfill (milestone M6). Started by hand. Reads N months back from every enabled source but the PV
# mailbox (or one source), flags everything as backfill, sends no alerts, and ends with one summary to the admin
# (itself dry-run while app_setting.telegram_dry_run is true).
name: PHAROS backfill

on:
  workflow_dispatch:
    inputs:
      months:
        description: How many months back
        type: string
        default: "12"
      source:
        description: Only this source id (optional)
        type: string
        required: false

permissions:
  contents: read

# Its own group, never the "collectors" one (6 Nov 2026): a 285-minute backfill held that group and the readiness
# runs (literature look-backs, the check of the past) waited behind it for hours, and every new run queued behind
# it cancelled the one already waiting. It runs safely beside a collection:
# - a notice is stored once: insert_document skips a row another run stored meanwhile;
# - it leaves the literature searches (literature_search) alone, runs no label watch and no label comparison,
#   sends no alert, digest or reminder, and never reads the PV mailbox (select_sources);
# - every process waits 2 s between requests to one site and waits out a 429 or 503, so two runs together ask
#   a site at most once a second (NCBI allows 10 a second with our key).
# One backfill at a time: a second one dispatched waits here, and a third replaces the waiting one.
concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PHAROS_TIME_BUDGET_MIN: "285"   # stop cleanly before the timeout; the next run continues
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Check inputs
        env:
          MONTHS: ${{ inputs.months }}
          SOURCE: ${{ inputs.source }}
        run: |
          [[ "$MONTHS" =~ ^[0-9]{1,3}$ ]] && [ "$MONTHS" -ge 1 ] && [ "$MONTHS" -le 240 ] || { echo "months must be 1-240"; exit 1; }
          [ -z "$SOURCE" ] || [[ "$SOURCE" =~ ^[a-z0-9-]+$ ]] || { echo "bad source id"; exit 1; }

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            poppler-utils tesseract-ocr tesseract-ocr-jpn tesseract-ocr-kor tesseract-ocr-fin tesseract-ocr-swe
            tesseract-ocr-dan tesseract-ocr-nor tesseract-ocr-isl tesseract-ocr-deu tesseract-ocr-fra
            tesseract-ocr-ita tesseract-ocr-spa tesseract-ocr-por tesseract-ocr-nld tesseract-ocr-ara
          version: "1"

      - run: pip install -r collectors/requirements.txt

      - id: pw-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('collectors/requirements.txt') }}
      - name: Playwright install
        env:
          HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" != "true" ]; then python -m playwright install --with-deps chromium
          else python -m playwright install-deps chromium; fi

      - name: Backfill
        env:
          # Secrets go to this step only, never to the job: the setup actions above never see them.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          PHAROS_IMAP_HOST: ${{ secrets.PHAROS_IMAP_HOST }}
          PHAROS_IMAP_PORT: ${{ secrets.PHAROS_IMAP_PORT }}
          PHAROS_IMAP_USER: ${{ secrets.PHAROS_IMAP_USER }}
          PHAROS_IMAP_PASSWORD: ${{ secrets.PHAROS_IMAP_PASSWORD }}
          MONTHS: ${{ inputs.months }}
          SOURCE: ${{ inputs.source }}
        run: |
          args=(--schedule all --backfill "$MONTHS")
          [ -n "$SOURCE" ] && args+=(--source "$SOURCE")
          python -m collectors.run "${args[@]}"
