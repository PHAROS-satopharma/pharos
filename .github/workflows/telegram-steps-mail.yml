# PHAROS — email one person the steps to connect Telegram, from pharos@satopharma.com. Run by hand only.
# Without "send" ticked it only prints the message. The address must be an active PHAROS person whose
# Telegram is not connected yet (collectors/telegram_steps_mail.py refuses anyone else).
name: PHAROS Telegram steps email

on:
  workflow_dispatch:
    inputs:
      email:
        description: The PHAROS person's email address
        type: string
        required: true
      greeting:
        description: How the email addresses them (e.g. Dr Sama); empty = their full name
        type: string
        required: false
      send:
        description: Send it (unticked = preview only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: telegram-steps-mail
  cancel-in-progress: false

jobs:
  mail:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - run: pip install -r collectors/requirements.txt

      - name: Email the Telegram steps
        env:
          # Inputs go through the environment, never into the command line.
          EMAIL: ${{ inputs.email }}
          GREETING: ${{ inputs.greeting }}
          SEND: ${{ inputs.send }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PHAROS_IMAP_HOST: ${{ secrets.PHAROS_IMAP_HOST }}
          PHAROS_IMAP_USER: ${{ secrets.PHAROS_IMAP_USER }}
          PHAROS_IMAP_PASSWORD: ${{ secrets.PHAROS_IMAP_PASSWORD }}
        run: |
          args=(--email "$EMAIL" --greeting "$GREETING")
          [ "$SEND" = "true" ] && args+=(--send)
          python -m collectors.telegram_steps_mail "${args[@]}"
