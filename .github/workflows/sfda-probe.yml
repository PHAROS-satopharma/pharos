name: sfda probe (temporary)
on:
  push:
    branches: [pharos-sfda-reads]
    paths: [.github/workflows/sfda-probe.yml]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix: {n: [1, 2, 3, 4]}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe both SFDA servers
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          echo "runner $(curl -s https://api.ipify.org)"
          getent ahostsv4 www.sfda.gov.sa | head -2
          resolvectl query www.sfda.gov.sa 2>/dev/null | head -3 || true
          for ip in 195.189.212.79 195.189.213.79; do
            for i in 1 2 3 4 5 6 7 8; do
              r=$(curl -s -o /dev/null -A "$UA" --resolve www.sfda.gov.sa:443:$ip \
                -w "%{http_code} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}" \
                --max-time 40 https://www.sfda.gov.sa/ar/warnings; echo " exit=$?")
              echo "PROBE $ip #$i $r"; sleep 2
            done
          done
          for i in 1 2 3 4 5 6; do
            r=$(curl -s -o /dev/null -A "$UA" -w "%{remote_ip} %{http_code} ttfb=%{time_starttransfer} total=%{time_total}" \
              --max-time 40 https://www.sfda.gov.sa/ar/drugs_circulars_withdrawal; echo " exit=$?")
            echo "PROBE dns #$i $r"; sleep 20
          done
