# PHAROS — the weekly label (SPC) watch, one job per label source, all at once (13 Nov 2026).
#
# Until then the seventeen sources shared the weekly collection's 78 minutes, about 4.6 minutes each. On 9 Nov
# DailyMed, CIMA and the MHRA spent all of it on their product lists and read no label, and 3,608 of 5,483 labels
# had never been read. Each source now has its own job and the whole budget: 330 minutes, more than the slowest
# source needs to read every one of its labels (DailyMed reads about 25 a minute: 1,911 in about 80).
#
# - Each job is `python -m collectors.run --schedule weekly --spc-source <id>`: that source only, every watched
#   ingredient, with its source_run row, health and alerts as before (collectors/spc/run.py). A source switched
#   off on the Sources screen reads nothing. Every request to one site is still one at a time, 2 s apart: each
#   job asks one regulator, as the single job did.
# - Its own group, never "collectors": hours of label reading never hold the regular collections or the
#   readiness runs. It runs beside them as the backfill does: a job reads and writes only its own source's
#   products, snapshots and changes, and sends no digest or reminder (the regular runs keep those).
# - The database's back-up timer (pharos-kick-weekly, Monday 04:13 UTC) starts it with the event "label-watch" when
#   no job of the week has started (supabase/migrations/0112). Each job records run.schedule = 'weekly'.
# - The list of sources below must be collectors.spc.run.MODULES (tests/test_label_watch_workflow.py).
name: PHAROS label watch

on:
  schedule:
    - cron: "23 3 * * 1"      # Monday 03:23 UTC (05:23 Cairo)
  repository_dispatch:
    types: [label-watch]
  workflow_dispatch:
    inputs:
      source:
        description: Only this label source (optional, e.g. spc-dailymed)
        type: string
        required: false

permissions:
  contents: read

# One week's watch at a time; a second one started meanwhile waits here.
concurrency:
  group: label-watch
  cancel-in-progress: false

jobs:
  watch:
    if: ${{ !inputs.source || contains(fromJSON('["spc-aifa","spc-basg","spc-bdpm","spc-cbg","spc-cima","spc-dailymed","spc-ema-epar","spc-famhp","spc-hc-dpd","spc-hpra","spc-infomed","spc-lyfja","spc-medsafe","spc-mhra","spc-mpa","spc-nedrug","spc-pmda"]'), inputs.source) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false        # one source failing never stops the others
      max-parallel: 12        # leaves room for the regular collections and the deploys
      matrix:
        source: >-
          ${{ inputs.source && fromJSON(format('["{0}"]', inputs.source)) || fromJSON('["spc-aifa","spc-basg","spc-bdpm","spc-cbg","spc-cima","spc-dailymed","spc-ema-epar","spc-famhp","spc-hc-dpd","spc-hpra","spc-infomed","spc-lyfja","spc-medsafe","spc-mhra","spc-mpa","spc-nedrug","spc-pmda"]') }}
    name: ${{ matrix.source }}
    # The job stops starting new labels at the budget and ends cleanly; setup takes about 4 minutes.
    timeout-minutes: 345
    env:
      PHAROS_TIME_BUDGET_MIN: "330"
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - name: PDF text and OCR (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            poppler-utils tesseract-ocr tesseract-ocr-jpn tesseract-ocr-kor tesseract-ocr-fin tesseract-ocr-swe
            tesseract-ocr-dan tesseract-ocr-nor tesseract-ocr-isl tesseract-ocr-deu tesseract-ocr-fra
            tesseract-ocr-ita tesseract-ocr-spa tesseract-ocr-por tesseract-ocr-nld tesseract-ocr-ara
          version: "1"

      - name: Python packages
        run: pip install -r collectors/requirements.txt

      # The label sites that answer only to a browser engine (the MHRA, the HPRA, BASG, Iceland) need it.
      - name: Playwright browser (cached)
        id: pw-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('collectors/requirements.txt') }}
      - name: Playwright install
        env:
          HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" != "true" ]; then python -m playwright install --with-deps chromium
          else python -m playwright install-deps chromium; fi

      - name: Label watch
        env:
          # Secrets go to this step only, never to the job: the setup actions above never see them.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          SOURCE: ${{ matrix.source }}
        run: |
          [[ "$SOURCE" =~ ^spc-[a-z0-9-]+$ ]] || { echo "bad source id"; exit 1; }
          python -m collectors.run --schedule weekly --spc-source "$SOURCE"
