# PHAROS — checks on every pull request and every push to main.
# One job (one billed minute-rounding instead of five), and each part runs only when its files changed
# (everything runs when this file changes or on a manual run). Nothing here touches the live project.
name: PHAROS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel on main: the deploys wait for a successful CI run on main (workflow_run), so a cancelled
  # run would silently skip that push's deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: What changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          [ "$EVENT" = "pull_request" ] && base="$PR_BASE"
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            files="ALL"
          else
            files="$(git diff --name-only "$base" HEAD)"
            echo "$files" | grep -q '^\.github/workflows/ci\.yml$' && files="ALL"
          fi
          has() { [ "$files" = "ALL" ] || echo "$files" | grep -qE "$1"; }
          out() { if has "$2"; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi; }
          out py    '^(collectors/|tests/|pyproject\.toml)'
          out report '^(collectors/report|collectors/requirements\.txt|tests/test_report_credit\.py)'
          out web   '^web/'
          out sql   '^supabase/migrations/'
          out deno  '^supabase/functions/'
          out worker '^workers/'
          cat "$GITHUB_OUTPUT"

      # ───────────── collectors: ruff + pytest ─────────────
      # Python is also set up when only migrations changed: the Store SQL test below needs it.
      - name: Python 3.12
        if: (steps.changes.outputs.py == 'true' || steps.changes.outputs.sql == 'true') && hashFiles('collectors/requirements.txt') != ''
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt
      - name: PDF and OCR tools
        if: steps.changes.outputs.py == 'true' && hashFiles('collectors/requirements.txt') != ''
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: poppler-utils tesseract-ocr tesseract-ocr-jpn tesseract-ocr-kor tesseract-ocr-fin
          version: "1"
      - name: Python dependencies
        if: (steps.changes.outputs.py == 'true' || steps.changes.outputs.sql == 'true') && hashFiles('collectors/requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r collectors/requirements.txt ruff pytest
      # Chromium for the monthly report test that prints a real PDF and reads its footer on every page; only
      # when the report changed (the test then fails, never skips, without it: REPORT_PDF below).
      - name: Playwright cache
        if: steps.changes.outputs.report == 'true' && hashFiles('collectors/requirements.txt') != ''
        id: pw-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('collectors/requirements.txt') }}
      - name: Playwright Chromium
        if: steps.changes.outputs.report == 'true' && hashFiles('collectors/requirements.txt') != ''
        env:
          HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" != "true" ]; then python -m playwright install --with-deps chromium
          else python -m playwright install-deps chromium; fi
      - name: Ruff and pytest
        if: steps.changes.outputs.py == 'true' && hashFiles('collectors/requirements.txt') != ''
        env:
          REPORT_PDF: ${{ steps.changes.outputs.report }}
        run: |
          ruff check .
          set +e
          python -m pytest
          code=$?
          set -e
          # 5 = no tests collected yet (allowed while the test folder is still empty)
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then exit "$code"; fi

      # ───────────── web: npm ci, typecheck, build ─────────────
      - name: Node 22
        if: steps.changes.outputs.web == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web typecheck and build
        if: steps.changes.outputs.web == 'true'
        working-directory: web
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: |
          npm ci --no-audit --no-fund
          npm run --if-present typecheck
          npm run --if-present test -- --run
          npm run build

      # ───────────── migrations against Postgres 16 with a minimal auth stub ─────────────
      # Also when only Python changed: the Store SQL test after this step needs the schema.
      - name: Apply migrations and run database acceptance checks
        if: steps.changes.outputs.sql == 'true' || steps.changes.outputs.py == 'true'
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          P="psql -v ON_ERROR_STOP=1 -q"
          # What Supabase provides and the migrations rely on: the API roles, auth.users, auth.uid(),
          # and default privileges (so that row-level security, not missing grants, is what is tested).
          $P <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users (id uuid primary key, email text);
          create function auth.uid() returns uuid language sql stable as $$
            select coalesce(nullif(current_setting('request.jwt.claim.sub', true), ''),
                            nullif(current_setting('request.jwt.claims', true), '')::jsonb ->> 'sub')::uuid
          $$;
          grant usage on schema public, auth to anon, authenticated, service_role;
          grant execute on function auth.uid() to anon, authenticated, service_role;
          alter default privileges in schema public grant all on tables to anon, authenticated, service_role;
          alter default privileges in schema public grant all on sequences to anon, authenticated, service_role;
          alter default privileges in schema public grant all on functions to anon, authenticated, service_role;
          SQL
          # Supabase records a migration by its number alone: two files with one number deploy the first and
          # refuse the second (5 Nov 2026: two 0019 files stopped the deploy).
          dup=$(ls supabase/migrations/*.sql | sed -E 's#.*/([0-9]+)_.*#\1#' | sort | uniq -d)
          if [ -n "$dup" ]; then echo "::error::Two migrations share the number: $dup. Renumber the newer one."; exit 1; fi
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::apply $f"
            $P -f "$f"
            echo "::endgroup::"
          done

          $P <<'SQL'
          create function pg_temp.ci_assert(ok boolean, msg text) returns void language plpgsql as $$
          begin
            if not coalesce(ok, false) then raise exception 'FAIL: %', msg; end if;
            raise notice 'ok: %', msg;
          end $$;

          insert into auth.users (id, email) values
            ('00000000-0000-0000-0000-0000000000a1', 'admin@example.test'),
            ('00000000-0000-0000-0000-0000000000b2', 'reader@example.test');
          insert into person (auth_user_id, full_name, email, role) values
            ('00000000-0000-0000-0000-0000000000a1', 'CI Admin', 'admin@example.test', 'admin'),
            ('00000000-0000-0000-0000-0000000000b2', 'CI Reader', 'reader@example.test', 'reader');
          insert into regulator (id, country_code, country_name, name, languages)
            values ('CI-TEST', 'FI', 'Finland', 'CI test regulator', '{fi}');
          insert into source (id, regulator_id, kind, channel, url, parser, languages)
            values ('ci-test', 'CI-TEST', 'safety', 'html', 'https://example.test/', 'generic_html', '{fi}');
          insert into document (id, source_id, external_id, url, title_orig, lang)
            values ('00000000-0000-0000-0000-0000000000d1', 'ci-test', 'x1', 'https://example.test/1', 'CI', 'fi');
          insert into document_text (document_id, text)
            values ('00000000-0000-0000-0000-0000000000d1', 'Valmiste sisältää lornoksikaamia.');
          insert into issue (id, doc_type, title) values ('00000000-0000-0000-0000-0000000000e1', 'dhpc', 'CI issue');

          -- 0012: the notice list returns the language of the title's notice.
          insert into issue (id, doc_type, title, anchor_document_id)
            values ('00000000-0000-0000-0000-0000000000e7', 'dhpc', 'CI', '00000000-0000-0000-0000-0000000000d1');
          select pg_temp.ci_assert((select lang from v_issue_table where id = '00000000-0000-0000-0000-0000000000e7') = 'fi',
            'the notice list carries the language of the title');
          delete from issue where id = '00000000-0000-0000-0000-0000000000e7';

          -- 0019: a notice published long before PHAROS first saw it is history, with its notification.
          insert into document (id, source_id, external_id, url, title_orig, published_date, first_seen_at) values
            ('00000000-0000-0000-0000-0000000000d8', 'ci-test', 'old', 'https://example.test/old', 'Old letter',
             '2016-01-14', '2026-11-05 06:50+00'),
            ('00000000-0000-0000-0000-0000000000d9', 'ci-test', 'new', 'https://example.test/new', 'New letter',
             '2026-10-20', '2026-11-05 06:50+00'),
            ('00000000-0000-0000-0000-0000000000da', 'ci-test', 'nodate', 'https://example.test/nd', 'No date',
             null, '2026-11-05 06:50+00');
          insert into issue (id, doc_type, title, anchor_document_id) values
            ('00000000-0000-0000-0000-0000000000e8', 'dhpc', 'Old letter', '00000000-0000-0000-0000-0000000000d8'),
            ('00000000-0000-0000-0000-0000000000e9', 'dhpc', 'New letter', '00000000-0000-0000-0000-0000000000d9');
          \i supabase/migrations/0020_old_notices_are_history.sql
          select pg_temp.ci_assert((select is_backfill from document where id = '00000000-0000-0000-0000-0000000000d8')
            and (select is_backfill from issue where id = '00000000-0000-0000-0000-0000000000e8'),
            'a 2016 letter first seen in 2026 is history, and so is its notification');
          select pg_temp.ci_assert(not (select is_backfill from document where id = '00000000-0000-0000-0000-0000000000d9')
            and not (select is_backfill from issue where id = '00000000-0000-0000-0000-0000000000e9')
            and not (select is_backfill from document where id = '00000000-0000-0000-0000-0000000000da'),
            'a recent notice and an undated one stay current');
          delete from issue where id in ('00000000-0000-0000-0000-0000000000e8', '00000000-0000-0000-0000-0000000000e9');
          delete from document where id in ('00000000-0000-0000-0000-0000000000d8', '00000000-0000-0000-0000-0000000000d9',
                                            '00000000-0000-0000-0000-0000000000da');

          -- Test 10: the public key reads nothing and cannot call the RPCs.
          set role anon;
          select count(*) as anon_person from person \gset
          select count(*) as anon_issue from issue \gset
          do $$ declare denied boolean := false; begin
            begin perform 1 from inbound_email; exception when insufficient_privilege then denied := true; end;
            if not denied then raise exception 'FAIL: anon can select inbound_email'; end if;
            denied := false;
            begin perform create_link_token(); exception when insufficient_privilege then denied := true; end;
            if not denied then raise exception 'FAIL: anon can call create_link_token'; end if;
            denied := false;
            begin perform archive_hit_count('lorno', null); exception when insufficient_privilege then denied := true; end;
            if not denied then raise exception 'FAIL: anon can call archive_hit_count'; end if;
          end $$;
          reset role;
          select pg_temp.ci_assert(:anon_person = 0 and :anon_issue = 0, 'anon reads no rows');

          -- Test 11 (database half): a one-time code, stored only as its sha256; a new code retires the old one.
          select set_config('request.jwt.claims', '{"sub":"00000000-0000-0000-0000-0000000000b2","role":"authenticated"}', false);
          set role authenticated;
          select create_link_token() as code1 \gset
          select create_link_token() as code2 \gset
          select count(*) as reader_tokens from link_token \gset
          reset role;
          select pg_temp.ci_assert(:'code1' ~ '^[A-Za-z0-9_-]{24}$', 'link code is 24 URL-safe characters');
          select pg_temp.ci_assert(exists (select 1 from link_token
            where token_hash = encode(sha256(convert_to(:'code2', 'UTF8')), 'hex') and used_at is null and expires_at > now()),
            'only the hash of the code is stored and it is open');
          select pg_temp.ci_assert(not exists (select 1 from link_token where token_hash in (:'code1', :'code2')),
            'the plain code is never stored');
          select pg_temp.ci_assert(exists (select 1 from link_token
            where token_hash = encode(sha256(convert_to(:'code1', 'UTF8')), 'hex') and expires_at <= now()),
            'creating a new code retires the older one');
          select pg_temp.ci_assert(:reader_tokens = 0, 'nobody can read link_token through the API');

          -- Test 10: a reader cannot change status or queue a probe; archive test counts per language.
          set role authenticated;
          update issue set status = 'reviewed' where id = '00000000-0000-0000-0000-0000000000e1';
          do $$ declare denied boolean := false; begin
            begin
              insert into review_event (issue_id, from_status, to_status, person_id)
              values ('00000000-0000-0000-0000-0000000000e1', 'new', 'reviewed', my_person_id());
            exception when insufficient_privilege then denied := true; end;
            if not denied then raise exception 'FAIL: a reader recorded a review decision'; end if;
            denied := false;
            begin
              insert into probe_result (url, requested_by) values ('https://example.test/', my_person_id());
            exception when insufficient_privilege then denied := true; end;
            if not denied then raise exception 'FAIL: a reader queued a probe'; end if;
          end $$;
          select archive_hit_count('LORNOKSIKAAM', 'fi') as hits_fi \gset
          select archive_hit_count('lornoksikaam', 'de') as hits_de \gset
          select archive_hit_count('100%', null) as hits_wild \gset
          reset role;
          select pg_temp.ci_assert((select status from issue where id = '00000000-0000-0000-0000-0000000000e1') = 'new',
            'a reader cannot change an issue status');
          select pg_temp.ci_assert(:hits_fi = 1 and :hits_de = 0, 'archive_hit_count is case-insensitive and language-filtered');
          select pg_temp.ci_assert(:hits_wild = 0, 'LIKE wildcards in the term are literal');

          -- 0016: the archive test counts notices, and reads their titles and structured data too.
          insert into document (id, source_id, external_id, url, title_orig, lang, structured) values
            ('00000000-0000-0000-0000-0000000000d2', 'ci-test', 'x2', 'https://example.test/2',
             'Lornoxicam and the kidney', 'en', '{"abstract": "A case after lornoxicam."}'),
            ('00000000-0000-0000-0000-0000000000d3', 'ci-test', 'x3', 'https://example.test/3',
             'A case report', 'en', '{"mesh": [{"term": "Lornoxicam"}], "lornoxicam_key": 1}'),
            ('00000000-0000-0000-0000-0000000000d4', 'ci-test', 'x4', 'https://example.test/4',
             'Nothing here', 'en', '{"lornoxicam": "a key, not a value"}');
          insert into attachment (id, document_id, url)
            values ('00000000-0000-0000-0000-0000000000f1', '00000000-0000-0000-0000-0000000000d1', 'https://example.test/1.pdf');
          insert into document_text (document_id, attachment_id, text)
            values ('00000000-0000-0000-0000-0000000000d1', '00000000-0000-0000-0000-0000000000f1', 'Liite: lornoksikaami.');
          set role authenticated;
          select archive_hit_count('lornoxicam', 'en') as hits_en \gset
          select archive_hit_count('lornoksikaam', 'fi') as hits_fi2 \gset
          reset role;
          select pg_temp.ci_assert(:hits_en = 2,
            'a notice is found by its title or a value in its data, never by a key (' || :hits_en || ')');
          select pg_temp.ci_assert(:hits_fi2 = 1, 'a notice whose page and attachment both name it is counted once');
          delete from document where id in ('00000000-0000-0000-0000-0000000000d2', '00000000-0000-0000-0000-0000000000d3',
                                            '00000000-0000-0000-0000-0000000000d4');

          -- 0022: a backslash in the term is literal, never a LIKE escape.
          insert into document (id, source_id, external_id, url, title_orig, lang) values
            ('00000000-0000-0000-0000-0000000000d5', 'ci-test', 'x5', 'https://example.test/5', 'Saved under C:\temp here', 'en'),
            ('00000000-0000-0000-0000-0000000000d6', 'ci-test', 'x6', 'https://example.test/6', 'Saved under C:temp here', 'de');
          set role authenticated;
          select archive_hit_count('c:\temp', 'en') as hits_bs \gset
          select archive_hit_count('c:\temp', 'de') as hits_nobs \gset
          reset role;
          select pg_temp.ci_assert(:hits_bs = 1 and :hits_nobs = 0,
            'a backslash in the term is literal (' || :hits_bs || ', ' || :hits_nobs || ')');
          delete from document where id in ('00000000-0000-0000-0000-0000000000d5', '00000000-0000-0000-0000-0000000000d6');
          delete from attachment where id = '00000000-0000-0000-0000-0000000000f1';

          -- An admin can queue a probe as themselves.
          select set_config('request.jwt.claims', '{"sub":"00000000-0000-0000-0000-0000000000a1","role":"authenticated"}', false);
          set role authenticated;
          insert into probe_result (url, requested_by) values ('https://example.test/', my_person_id());
          reset role;
          select pg_temp.ci_assert((select count(*) from probe_result where status = 'queued') = 1, 'an admin queues a probe');

          -- 0011: saving an ingredient without an ATC code twice keeps one ingredient; a second ATC code of
          -- the same substance is its own ingredient and never overwrites the first.
          set role authenticated;
          select save_ingredient('{"inn_en":"Ciexampline","terms":[{"lang":"en","term":"ciexampline"}]}') as ing1 \gset
          select save_ingredient('{"inn_en":"ciexampline ","rxcui":"999","terms":[{"lang":"fi","term":"ciexampliini"}]}') as ing2 \gset
          select save_ingredient('{"inn_en":"Cidexa","atc_code":"Z99AA01"}') as atc1 \gset
          select save_ingredient('{"inn_en":"Cidexa","atc_code":"Z99BB02"}') as atc2 \gset
          reset role;
          select pg_temp.ci_assert(:'ing1' = :'ing2'
              and (select count(*) from ingredient where lower(inn_en) = 'ciexampline') = 1
              and (select rxcui from ingredient where id = :'ing1') = '999'
              and (select count(*) from ingredient_term where ingredient_id = :'ing1') = 2,
            'an ingredient without an ATC code is updated, not added again');
          select pg_temp.ci_assert(:'atc1' <> :'atc2'
              and (select atc_code from ingredient where id = :'atc1') = 'Z99AA01',
            'a second ATC code of the same name is a separate ingredient');

          -- Test 10 and 6: "Not relevant" needs a comment; review_event is append-only.
          do $$
          declare
            admin_id uuid := (select id from person where email = 'admin@example.test');
            refused boolean := false;
          begin
            begin
              insert into review_event (issue_id, from_status, to_status, person_id)
              values ('00000000-0000-0000-0000-0000000000e1', 'new', 'not_relevant', admin_id);
            exception when check_violation then refused := true; end;
            if not refused then raise exception 'FAIL: not_relevant without a comment was accepted'; end if;

            insert into review_event (issue_id, from_status, to_status, comment, person_id)
            values ('00000000-0000-0000-0000-0000000000e1', 'new', 'reviewed', 'CI', admin_id);
            refused := false;
            begin
              update review_event set comment = 'changed';
            exception when others then refused := sqlerrm like '%append-only%'; end;
            if not refused then raise exception 'FAIL: an UPDATE on review_event was not rejected'; end if;
            refused := false;
            begin
              delete from review_event;
            exception when others then refused := sqlerrm like '%append-only%'; end;
            if not refused then raise exception 'FAIL: a DELETE on review_event was not rejected'; end if;
          end $$;

          -- Test 9 (database half): no run → one admin alert, logged only while dry run is on; then quiet for 6 h.
          select ops_watchdog() as wd1 \gset
          select ops_watchdog() as wd2 \gset
          select pg_temp.ci_assert(:'wd1' = 'logged (dry run)' and :'wd2' = 'suppressed', 'watchdog alerts once, then waits');
          select pg_temp.ci_assert((select count(*) from ops_alert_log where dry_run and not sent) = 1, 'dry-run alert is logged, not sent');
          select pg_temp.ci_assert((select message from ops_alert_log order by id desc limit 1) like '%checked a source successfully yet%',
            'the watchdog says no source has been read yet');

          -- Audit fix: a run that merely finished (crashed, or every source failed) is not a healthy run.
          insert into run (trigger, finished_at, ok) values ('cron', now(), false);
          delete from ops_state where key = 'watchdog_last_alert_at';
          select ops_watchdog() as wd3 \gset
          update source set last_ok_at = now() where id = 'ci-test';
          delete from ops_state where key = 'watchdog_last_alert_at';
          select ops_watchdog() as wd4 \gset
          select pg_temp.ci_assert(:'wd3' = 'logged (dry run)', 'a finished run with no source read still alerts');
          select pg_temp.ci_assert(:'wd4' = 'ok', 'a source read in the last 6 hours is healthy');

          -- Audit fix: the watchdog goes live only on the JSON boolean false, like the collector and the switch guard.
          update source set last_ok_at = null where id = 'ci-test';
          update app_setting set value = '"false"' where key = 'telegram_dry_run';
          delete from ops_state where key = 'watchdog_last_alert_at';
          select ops_watchdog() as wd5 \gset
          update app_setting set value = '"maybe"' where key = 'telegram_dry_run';
          delete from ops_state where key = 'watchdog_last_alert_at';
          select ops_watchdog() as wd6 \gset
          update app_setting set value = 'true' where key = 'telegram_dry_run';
          update source set last_ok_at = now() where id = 'ci-test';
          delete from ops_state where key = 'watchdog_last_alert_at';
          select pg_temp.ci_assert(:'wd5' = 'logged (dry run)', 'the text "false" keeps the watchdog in dry run');
          select pg_temp.ci_assert(:'wd6' = 'logged (dry run)', 'an unreadable switch keeps the watchdog in dry run');

          -- 0019: the watchdog's back-up chat is the oldest linked admin WITH Source health alerts, never an
          -- admin who did not ask for them (the QPPV is an admin and receives safety notices only).
          insert into person (full_name, email, role, telegram_chat_id, created_at)
            values ('CI QPPV', 'qppv@example.test', 'admin', 9001, now() - interval '30 days');
          update person set telegram_chat_id = 9002 where email = 'admin@example.test';
          select pg_temp.ci_assert(ops_health_chat() is null, 'no health chat while no admin asked for health alerts');
          insert into subscription (person_id, kind) select id, 'admin_health' from person where email = 'admin@example.test';
          select pg_temp.ci_assert(ops_health_chat() = '9002', 'the health chat is the admin who asked, not the older QPPV admin');
          delete from subscription where kind = 'admin_health';
          update person set telegram_chat_id = null where email = 'admin@example.test';
          delete from person where email = 'qppv@example.test';

          -- Audit fix: the screening log counts a run in its CAIRO month (31 Oct 2026 is UTC+2 in Cairo).
          insert into source_run (run_id, source_id, started_at)
            select r.id, 'ci-test', t
              from (select id from run where finished_at is not null limit 1) r,
                   unnest(array['2026-10-31 22:30+00', '2026-10-31 21:30+00']::timestamptz[]) t;
          select set_config('request.jwt.claims', '{"sub":"00000000-0000-0000-0000-0000000000b2","role":"authenticated"}', false);
          set role authenticated;
          select runs as log_nov from monthly_screening_log('2026-11-01') where source_id = 'ci-test' \gset
          select runs as log_oct from monthly_screening_log('2026-10-01') where source_id = 'ci-test' \gset
          reset role;
          select pg_temp.ci_assert(:log_nov = 1 and :log_oct = 1,
            '00:30 on 1 Nov Cairo counts in November, 23:30 on 31 Oct Cairo in October');

          -- The admin's test message: admins only, only to his own linked chat, the reason when it cannot go.
          select set_config('request.jwt.claims', '{"sub":"00000000-0000-0000-0000-0000000000b2","role":"authenticated"}', false);
          set role authenticated;
          do $$ declare denied boolean := false; begin
            begin perform send_telegram_test(); exception when insufficient_privilege then denied := true; end;
            if not denied then raise exception 'FAIL: a reader sent a test message'; end if;
          end $$;
          reset role;
          select set_config('request.jwt.claims', '{"sub":"00000000-0000-0000-0000-0000000000a1","role":"authenticated"}', false);
          set role authenticated;
          select send_telegram_test()::text as t_unlinked \gset
          reset role;
          update person set telegram_chat_id = 4242 where email = 'admin@example.test';
          set role authenticated;
          select send_telegram_test()::text as t_novault \gset
          reset role;
          select pg_temp.ci_assert(:'t_unlinked'::jsonb ->> 'reason' = 'Your Telegram is not connected yet.',
            'an unlinked admin is told to connect first');
          select pg_temp.ci_assert((:'t_novault'::jsonb ->> 'ok')::boolean = false
            and exists (select 1 from ops_alert_log where kind = 'test' and not sent and error like '%TELEGRAM_BOT_TOKEN%'),
            'without the bot token nothing is sent and the reason is logged');

          -- 0008 (1): a decision is taken against the notice's true status, at the database's own time.
          insert into auth.users (id, email) values
            ('00000000-0000-0000-0000-0000000000c3', 'reviewer@example.test'),
            ('00000000-0000-0000-0000-0000000000d4', 'admin2@example.test');
          insert into person (auth_user_id, full_name, email, role, telegram_chat_id) values
            ('00000000-0000-0000-0000-0000000000c3', 'CI Reviewer', 'reviewer@example.test', 'reviewer', 4343),
            ('00000000-0000-0000-0000-0000000000d4', 'CI Admin Two', 'admin2@example.test', 'admin', 4444);
          select pg_temp.ci_assert((select status from issue where id = '00000000-0000-0000-0000-0000000000e1') = 'reviewed',
            'the CI notice is Reviewed before the stale-decision checks');
          select set_config('request.jwt.claims', '{"sub":"00000000-0000-0000-0000-0000000000c3","role":"authenticated"}', false);
          set role authenticated;
          do $$ declare refused boolean := false; begin
            begin
              insert into review_event (issue_id, from_status, to_status, person_id)
              values ('00000000-0000-0000-0000-0000000000e1', 'new', 'relevant', my_person_id());
            exception when sqlstate 'PH409' then refused := sqlerrm like 'STALE_DECISION:%'; end;
            if not refused then raise exception 'FAIL: a decision made from a stale status was accepted'; end if;
            refused := false;
            begin
              insert into review_event (issue_id, from_status, to_status, person_id)
              values ('00000000-0000-0000-0000-0000000000e1', 'reviewed', 'new', my_person_id());
            exception when invalid_parameter_value then refused := true; end;
            if not refused then raise exception 'FAIL: a decision back to New was accepted'; end if;
            refused := false;
            begin
              insert into review_event (issue_id, from_status, to_status, person_id)
              values ('00000000-0000-0000-0000-0000000000e1', 'reviewed', 'reviewed', my_person_id());
            exception when invalid_parameter_value then refused := true; end;
            if not refused then raise exception 'FAIL: a decision that changes nothing was accepted'; end if;
          end $$;
          insert into review_event (issue_id, from_status, to_status, person_id, created_at)
            values ('00000000-0000-0000-0000-0000000000e1', 'reviewed', 'relevant', my_person_id(), '2000-01-01 00:00+00');
          reset role;
          select pg_temp.ci_assert((select bool_and(created_at > now() - interval '1 hour') from review_event
              where person_id = (select id from person where email = 'reviewer@example.test')),
            'a decision is stamped with the database time, never the time the browser sent');
          select pg_temp.ci_assert((select status from issue where id = '00000000-0000-0000-0000-0000000000e1') = 'relevant',
            'a decision from the true status is applied');

          -- 0008 (2): personal data. Own rows only for a reader; names of everyone through person_directory.
          insert into subscription (person_id, kind)
            select id, case when role = 'admin' then 'admin_health' else 'class_digest' end::sub_kind
              from person where email in ('admin@example.test', 'reader@example.test');
          insert into notification (person_id, issue_id, kind, dry_run, summary)
            select id, '00000000-0000-0000-0000-0000000000e1', 'immediate', true, 'CI'
              from person where email in ('admin@example.test', 'reader@example.test');
          select set_config('request.jwt.claims', '{"sub":"00000000-0000-0000-0000-0000000000b2","role":"authenticated"}', false);
          set role authenticated;
          select count(*) as rd_people from person \gset
          select count(*) as rd_others from person where email <> 'reader@example.test' or telegram_chat_id is not null \gset
          select count(*) as rd_audit from audit_log \gset
          select count(*) as rd_notif from notification \gset
          select count(*) as rd_notif_mine from notification where person_id = my_person_id() \gset
          select count(*) as rd_subs from subscription \gset
          select count(*) as rd_dir from person_directory \gset
          select full_name as rd_dir_admin from person_directory where full_name = 'CI Admin' \gset
          reset role;
          select pg_temp.ci_assert(:rd_people = 1 and :rd_others = 0,
            'a reader reads only his own person row: no one else''s email or Telegram chat id');
          select pg_temp.ci_assert(:rd_audit = 0 and (select count(*) from audit_log) > 0, 'a reader cannot read the audit log');
          select pg_temp.ci_assert(:rd_notif = 1 and :rd_notif_mine = 1 and :rd_subs = 1,
            'a reader reads only his own notifications and subscriptions');
          select pg_temp.ci_assert(:rd_dir = (select count(*) from person) and :'rd_dir_admin' = 'CI Admin',
            'a reader reads every name through person_directory');
          select pg_temp.ci_assert(not exists (select 1 from information_schema.columns
              where table_name = 'person_directory' and column_name in ('email', 'telegram_chat_id', 'auth_user_id')),
            'person_directory holds names, never contact details');
          set role anon;
          do $$ declare denied boolean := false; begin
            begin perform 1 from person_directory; exception when insufficient_privilege then denied := true; end;
            if not denied then raise exception 'FAIL: anon can read person_directory'; end if;
          end $$;
          reset role;
          select set_config('request.jwt.claims', '{"sub":"00000000-0000-0000-0000-0000000000a1","role":"authenticated"}', false);
          set role authenticated;
          select count(*) as ad_people from person where email is not null \gset
          select count(*) as ad_audit from audit_log \gset
          select count(*) as ad_notif from notification \gset
          select count(*) as ad_subs from subscription \gset
          reset role;
          select pg_temp.ci_assert(:ad_people = (select count(*) from person) and :ad_audit = (select count(*) from audit_log)
              and :ad_notif = (select count(*) from notification) and :ad_subs = (select count(*) from subscription),
            'an admin still reads every person, the audit log, every notification and every subscription');

          -- 0008 (3): real messages unlock only on THIS admin's own delivered test (no pg_net here).
          select set_config('request.jwt.claims', '{"sub":"00000000-0000-0000-0000-0000000000c3","role":"authenticated"}', false);
          set role authenticated;
          do $$ declare denied boolean := false; begin
            begin perform telegram_test_delivered(); exception when insufficient_privilege then denied := true; end;
            if not denied then raise exception 'FAIL: a reviewer read a test result'; end if;
          end $$;
          reset role;
          select set_config('request.jwt.claims', '{"sub":"00000000-0000-0000-0000-0000000000d4","role":"authenticated"}', false);
          set role authenticated;
          select telegram_test_delivered() ->> 'state' as tg_never \gset
          reset role;
          -- Another admin's test that Telegram delivered must not unlock anything for admin a1.
          insert into ops_alert_log (kind, message, dry_run, sent, request_id, person_id)
            select 'test', 'CI', false, true, 99, id from person where email = 'admin2@example.test';
          set role authenticated;
          select telegram_test_delivered() ->> 'state' as tg_queued \gset
          do $$ declare refused boolean := false; begin
            begin update app_setting set value = 'false' where key = 'telegram_dry_run';
            exception when insufficient_privilege then refused := sqlerrm like 'Real messages stay off%'; end;
            if not refused then raise exception 'FAIL: real messages turned on while the test was only queued'; end if;
          end $$;
          reset role;
          update ops_alert_log set delivered = true, tg_status = 200
           where person_id = (select id from person where email = 'admin2@example.test');
          select set_config('request.jwt.claims', '{"sub":"00000000-0000-0000-0000-0000000000a1","role":"authenticated"}', false);
          set role authenticated;
          select telegram_test_delivered()::text as tg_a1 \gset
          do $$ declare refused boolean := false; begin
            begin update app_setting set value = 'false' where key = 'telegram_dry_run';
            exception when insufficient_privilege then refused := sqlerrm like 'Real messages stay off%'; end;
            if not refused then raise exception 'FAIL: another admin''s delivered test unlocked real messages'; end if;
          end $$;
          -- 0024: deleting the switch and inserting it again, or renaming another row to it, is guarded too.
          do $$ declare refused boolean := false; begin
            begin
              delete from app_setting where key = 'telegram_dry_run';
              insert into app_setting (key, value) values ('telegram_dry_run', 'false');
            exception when insufficient_privilege then refused := sqlerrm like 'Real messages stay off%'; end;
            if not refused then raise exception 'FAIL: delete and insert turned real messages on without a test'; end if;
            refused := false;
            begin
              delete from app_setting where key = 'telegram_dry_run';
              update app_setting set key = 'telegram_dry_run', value = 'false' where key = 'backfill_months';
            exception when insufficient_privilege then refused := sqlerrm like 'Real messages stay off%'; end;
            if not refused then raise exception 'FAIL: renaming a row turned real messages on without a test'; end if;
          end $$;
          reset role;
          select pg_temp.ci_assert((select value from app_setting where key = 'telegram_dry_run') = 'true'::jsonb
              and exists (select 1 from app_setting where key = 'backfill_months'),
            'a refused switch leaves the settings as they were');
          select set_config('request.jwt.claims', '{"sub":"00000000-0000-0000-0000-0000000000d4","role":"authenticated"}', false);
          set role authenticated;
          select telegram_test_delivered() ->> 'state' as tg_delivered \gset
          update app_setting set value = 'false' where key = 'telegram_dry_run';
          reset role;
          select pg_temp.ci_assert(:'tg_never' = 'none', 'an admin who never sent a test has nothing delivered');
          select pg_temp.ci_assert(:'tg_queued' = 'pending', 'a test handed to pg_net is pending, not delivered');
          select pg_temp.ci_assert(:'tg_a1'::jsonb ->> 'state' = 'failed' and :'tg_a1'::jsonb ->> 'reason' like '%TELEGRAM_BOT_TOKEN%',
            'a test that never left is failed, with its reason');
          select pg_temp.ci_assert(:'tg_delivered' = 'delivered'
              and (select value from app_setting where key = 'telegram_dry_run') = 'false'::jsonb,
            'an admin whose own test was delivered can turn real messages on');
          update app_setting set value = 'true' where key = 'telegram_dry_run';

          -- The back-up timer: a slot that already ran is left alone; a skipped one asks GitHub,
          -- and without its Vault secrets the reason is logged. The app cannot call it.
          insert into run (trigger, schedule, started_at) values ('cron', '4h', now() - interval '20 minutes');
          select public.ops_kick_collect('4h') as k_ran \gset
          select public.ops_kick_collect('12h') as k_novault \gset
          select pg_temp.ci_assert(:'k_ran' = 'already ran', 'a slot GitHub ran is not started twice');
          select pg_temp.ci_assert(:'k_novault' = 'not started: Vault secrets missing'
            and exists (select 1 from ops_alert_log where kind = 'collect_kick' and not sent),
            'a skipped slot without the dispatch token logs why');
          select pg_temp.ci_assert(not has_function_privilege('authenticated', 'public.ops_kick_collect(text)', 'execute'),
            'signed-in users cannot start collections through the timer');

          -- 0010: a manual link is recorded as the person who made it, at the database's time.
          insert into issue (id, doc_type, title) values ('00000000-0000-0000-0000-0000000000e9', 'dhpc', 'CI link issue');
          select set_config('request.jwt.claims', '{"sub":"00000000-0000-0000-0000-0000000000a1","role":"authenticated"}', false);
          set role authenticated;
          insert into issue_document (issue_id, document_id, link, method, linked_by, linked_at)
            select '00000000-0000-0000-0000-0000000000e9', '00000000-0000-0000-0000-0000000000d1', 'copy', 'manual',
                   id, '2000-01-01 00:00+00' from person where email = 'reader@example.test';
          reset role;
          select pg_temp.ci_assert((select linked_by = (select id from person where email = 'admin@example.test')
                                           and linked_at > now() - interval '1 hour'
                                      from issue_document where issue_id = '00000000-0000-0000-0000-0000000000e9'),
            'a link names the signed-in person who made it and the database time, never what the browser sent');
          SQL

      # ───────────── the collectors' real SQL (collectors/core/store.py) on the migrated schema ─────────────
      - name: Store SQL against Postgres
        if: (steps.changes.outputs.sql == 'true' || steps.changes.outputs.py == 'true') && hashFiles('collectors/requirements.txt') != ''
        env:
          PHAROS_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -o pipefail
          python -m pytest -p no:cacheprovider -rs tests/test_store_pg.py | tee store-pg.log
          # A skip here would mean the database URL never arrived: that is a failure, not a pass.
          if grep -q "skipped" store-pg.log; then echo "::error::test_store_pg.py was skipped"; exit 1; fi

      # ───────────── Edge Functions: deno check ─────────────
      - name: Deno
        if: steps.changes.outputs.deno == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        if: steps.changes.outputs.deno == 'true'
        run: deno check supabase/functions/*/index.ts

      # ───────────── email Worker: typecheck ─────────────
      - name: Node 22 (Worker)
        if: steps.changes.outputs.worker == 'true' && steps.changes.outputs.web != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/email-inbound/package-lock.json
      - name: Type-check the email Worker
        if: steps.changes.outputs.worker == 'true'
        working-directory: workers/email-inbound
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
