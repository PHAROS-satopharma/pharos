# PHAROS — the medical dictionaries (collectors/coding/mesh.py). MeSH, the National Library of Medicine's Medical
# Subject Headings, publishes one release a year, late in the year before; this checks on the 2nd of every month
# and loads a release only when it is new (same SHA-256: nothing to do). Run it by hand after the first deploy of
# migration 0061, or with "force" to load the same release again. After the load, the labels and the papers are
# coded (0062): a new release codes every label again, and a run by hand fills the Ingredients screen at once.
# MedDRA (0102, collectors/coding/meddra.py) comes from the company's own MSSO subscription: an administrator uploads
# the release on the Cases screen, and the meddra job loads it within two hours (nothing waiting: nothing to do).
name: PHAROS dictionaries

on:
  schedule:
    - cron: "40 1 2 * *"     # 03:40 Cairo, the 2nd of the month: MeSH
    - cron: "25 */2 * * *"   # every two hours: a MedDRA upload waiting
  workflow_dispatch:
    inputs:
      force:
        description: Load MeSH again even when the same release is loaded
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dictionaries
  cancel-in-progress: false

jobs:
  mesh:
    if: github.event_name != 'schedule' || github.event.schedule == '40 1 2 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - name: Python packages
        run: pip install -r collectors/requirements.txt

      - name: MeSH
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python -m collectors.coding --mesh $FORCE

      # The same coding as the daily step of PHAROS collect; a failure warns and never fails the load.
      - name: Labels and papers
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python -m collectors.coding --labels --papers || echo "::warning::Coding stopped with an error; the daily collection continues it."

  meddra:
    if: github.event_name != 'schedule' || github.event.schedule == '25 */2 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - name: Python packages
        run: pip install -r collectors/requirements.txt

      # The log names only the version and the counts: MedDRA's terms are licensed and this repository is public.
      - name: MedDRA
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m collectors.coding --meddra
