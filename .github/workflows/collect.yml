# PHAROS — scheduled collection. ONE job per trigger; runs never overlap (shared "collectors" group with the
# check of the past and the matching audit; a backfill has its own group and runs beside it). GitHub keeps only
# ONE waiting run per group: a newer run queued behind a running one cancels the run already waiting. The
# database's back-up timers ask again for a slot whose run never started (0007 for 4h, 12h, weekly, monthly;
# 0084 every hour for the readiness slots daily and literature). Times are UTC; Cairo is UTC+2 in winter and
# UTC+3 in summer.
#
#   4h       every 4 hours at :17        feeds, JSON, APIs, HTML lists, the PV mailbox (IMAP)
#   12h      05:47 and 17:47             browser-engine sources (Playwright)
#   daily    02:31                       drug classes from the ATC code (a manual run can choose "classes" to run
#                                        only that step); large JSON files (EMA medicines, Health
#                                        Canada recalls …) and NCBI literature (PubMed and PubMed Central); the
#                                        EURD list; the check of the past (15 minutes); coding and the papers'
#                                        open full text (Unpaywall)
#   literature  10:41 and 18:41          the daily run's drug classes, NCBI literature (the enabled sources of
#                                        kind literature) and check of the past again, so a new ingredient is
#                                        ready within hours, not the next night; short when nothing is waiting
#   weekly   Monday 03:23                SPC / label watch, EMA's literature monitoring list
#   monthly  the 1st at 01:41            monthly sources (the report itself is report.yml)
#
# Telegram dry-run is NOT set here: the collectors read app_setting.telegram_dry_run (true until the owner
# approves the first real message). A manual run can force --dry-run.
name: PHAROS collect

on:
  schedule:
    - cron: "17 */4 * * *"
    - cron: "47 5,17 * * *"
    - cron: "31 2 * * *"
    - cron: "41 10,18 * * *"
    - cron: "23 3 * * 1"
    - cron: "41 1 1 * *"
  # The database's back-up timers (supabase/migrations/0007, 0084) for a slot whose run never started.
  repository_dispatch:
    types: [collect]
  workflow_dispatch:
    inputs:
      schedule:
        description: Which schedule to run
        type: choice
        options: ["4h", "12h", "daily", "literature", "weekly", "monthly", "all", "classes"]
        default: "4h"
      source:
        description: Only this source id (optional)
        type: string
        required: false
      dry_run:
        description: Force dry run (no Telegram, whatever the app setting says)
        type: boolean
        default: false
      spc_ingredient:
        description: Label watch for this one ingredient only (its id; runs nothing else, schedule is ignored)
        type: string
        required: false

permissions:
  contents: read
  # Claude signs in with this job's own GitHub token (federation): no Claude key is stored. Anthropic accepts
  # it only from this repository on main (collectors/core/claude.py).
  id-token: write

concurrency:
  group: collectors
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    # daily and literature: 80, for the drug classes before the collection and the check of the past after it;
    # every run but the weekly one keeps 20 minutes for a pack asked for on Reports (the last step), so 60 by default
    timeout-minutes: ${{ (github.event.schedule == '23 3 * * 1' || github.event.client_payload.schedule == 'weekly') && 90 || (github.event_name == 'workflow_dispatch' && 120 || ((github.event.schedule == '31 2 * * *' || github.event.schedule == '41 10,18 * * *' || github.event.client_payload.schedule == 'daily' || github.event.client_payload.schedule == 'literature') && 80 || 60)) }}
    env:
      # The collectors stop starting new notices and sources this many minutes in, so the run ends
      # cleanly (screening log, alerts, digest) instead of being killed by the timeout above.
      # Setup takes about 3 minutes; keep this about 10 below timeout-minutes.
      PHAROS_TIME_BUDGET_MIN: ${{ (github.event.schedule == '23 3 * * 1' || github.event.client_payload.schedule == 'weekly') && 78 || (github.event_name == 'workflow_dispatch' && 108 || 28) }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Which schedule
        id: which
        env:
          CRON: ${{ github.event.schedule }}
          INPUT_SCHEDULE: ${{ inputs.schedule || github.event.client_payload.schedule }}
          SPC_INGREDIENT: ${{ inputs.spc_ingredient }}
        run: |
          case "$CRON" in
            "17 */4 * * *")  s=4h ;;
            "47 5,17 * * *") s=12h ;;
            "31 2 * * *")    s=daily ;;
            "41 10,18 * * *") s=literature ;;
            "23 3 * * 1")    s=weekly ;;
            "41 1 1 * *")    s=monthly ;;
            *)               s="${INPUT_SCHEDULE:-4h}" ;;
          esac
          # One ingredient's label watch runs as "weekly": Playwright for the JS-only label sites, no daily steps, no packs.
          [ -n "$SPC_INGREDIENT" ] && s=weekly
          case "$s" in 4h|12h|daily|literature|weekly|monthly|all|classes) ;; *) echo "unknown schedule $s"; exit 1 ;; esac
          echo "schedule=$s" >> "$GITHUB_OUTPUT"
          # Only browser-engine runs need Playwright (12h, all, and the weekly SPC watch for JS-only sites).
          case "$s" in 12h|all|weekly) echo "browser=true" >> "$GITHUB_OUTPUT" ;; *) echo "browser=false" >> "$GITHUB_OUTPUT" ;; esac
          echo "Running schedule $s"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - name: PDF text and OCR (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            poppler-utils tesseract-ocr tesseract-ocr-jpn tesseract-ocr-kor tesseract-ocr-fin tesseract-ocr-swe
            tesseract-ocr-dan tesseract-ocr-nor tesseract-ocr-isl tesseract-ocr-deu tesseract-ocr-fra
            tesseract-ocr-ita tesseract-ocr-spa tesseract-ocr-por tesseract-ocr-nld tesseract-ocr-ara
          version: "1"

      - name: Python packages
        run: pip install -r collectors/requirements.txt

      - name: Playwright browser (cached)
        if: steps.which.outputs.browser == 'true'
        id: pw-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('collectors/requirements.txt') }}
      - name: Playwright install
        if: steps.which.outputs.browser == 'true'
        env:
          HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" != "true" ]; then python -m playwright install --with-deps chromium
          else python -m playwright install-deps chromium; fi

      # Drug classes from the ATC code (WHO's ATC index and Wikidata, collectors/classes.py), before the
      # collection so that a new ingredient's class words are looked for from this run on. A failure warns and
      # never fails the collection; that ingredient is tried again the next day.
      - name: Drug classes
        if: steps.which.outputs.schedule == 'daily' || steps.which.outputs.schedule == 'literature' || steps.which.outputs.schedule == 'all' || steps.which.outputs.schedule == 'classes'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m collectors.classes || echo "::warning::Some drug classes could not be made; they are tried again tomorrow."

      - name: Collect
        if: steps.which.outputs.schedule != 'classes'
        env:
          # Secrets go to this step only, never to the job: the setup actions above never see them.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          PHAROS_IMAP_HOST: ${{ secrets.PHAROS_IMAP_HOST }}
          PHAROS_IMAP_PORT: ${{ secrets.PHAROS_IMAP_PORT }}
          PHAROS_IMAP_USER: ${{ secrets.PHAROS_IMAP_USER }}
          PHAROS_IMAP_PASSWORD: ${{ secrets.PHAROS_IMAP_PASSWORD }}
          SCHEDULE: ${{ steps.which.outputs.schedule }}
          SOURCE: ${{ inputs.source }}
          DRY: ${{ inputs.dry_run && '1' || '' }}
          SPC_INGREDIENT: ${{ inputs.spc_ingredient }}
        run: |
          args=(--schedule "$SCHEDULE")
          if [ -n "$SOURCE" ]; then
            [[ "$SOURCE" =~ ^[a-z0-9-]+$ ]] || { echo "bad source id"; exit 1; }
            args+=(--source "$SOURCE")
          fi
          if [ -n "$SPC_INGREDIENT" ]; then
            [[ "$SPC_INGREDIENT" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "bad ingredient id"; exit 1; }
            args+=(--spc-ingredient "$SPC_INGREDIENT")
          fi
          [ -n "$DRY" ] && args+=(--dry-run)
          python -m collectors.run "${args[@]}"

      # EMA's EURD list (PSUR frequencies and data lock points), once a day: the readiness line on the Ingredients
      # page and the weekly report read its rows. A failure warns and never fails the collection; the list is
      # matched against today's watched ingredients and stored only when that changed.
      - name: EURD list
        if: steps.which.outputs.schedule == 'daily' || steps.which.outputs.schedule == 'all'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m collectors.eurd || echo "::warning::The EURD list could not be read; the PSUR dates keep the last list."

      # The check of the past (collectors/rematch.py): words saved after the notices arrived (a new ingredient,
      # a new or changed name, a new class word) are looked for in every stored notice, whatever its date, as
      # history: no Telegram message, no digest. 15 minutes a run, three runs a day (daily and literature); the
      # next run continues where it stopped (the "PHAROS check of the past" workflow runs it longer by hand). A
      # failure warns and never fails the collection.
      - name: Check of the past
        if: steps.which.outputs.schedule == 'daily' || steps.which.outputs.schedule == 'literature'
        env:
          PHAROS_TIME_BUDGET_MIN: "15"
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m collectors.rematch || echo "::warning::The check of the past stopped with an error; the next run continues it."

      # Medical coding of what the ingredient screen counts (collectors/coding, 0062): the MeSH headings NLM gave
      # each literature paper of the last year, and the MeSH names in our labels and the reference labels. Once a
      # day; a failure warns and never fails the collection (the next day continues).
      - name: Coding
        if: steps.which.outputs.schedule == 'daily' || steps.which.outputs.schedule == 'all'
        timeout-minutes: 15
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python -m collectors.coding --papers --labels || echo "::warning::Coding stopped with an error; the next day continues it."

      # Legal open-access full text (collectors/fulltext.py, 0070): the DOI of each literature paper of the last year
      # that has none yet (PubMed, every 30 days at most), then Unpaywall for each paper with a DOI not asked yet, or
      # asked over 30 days ago without an open copy. At most 2,000 lookups and 11 minutes a run; what is left waits for
      # the next day. A failure warns and never fails the collection.
      - name: Open full text
        if: steps.which.outputs.schedule == 'daily' || steps.which.outputs.schedule == 'all'
        timeout-minutes: 15
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python -m collectors.fulltext || echo "::warning::The open full-text lookups stopped with an error; the next day continues them."

      # EMA's medical literature monitoring list (which watched ingredients EMA screens itself), once a day, so
      # an ingredient added today is not shown as "not monitored by EMA" for a week. A failure warns and never
      # fails the collection; the list is matched against today's watched ingredients and stored only when that
      # changed.
      - name: Literature monitoring list
        if: steps.which.outputs.schedule == 'daily' || steps.which.outputs.schedule == 'all'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m collectors.mlm || echo "::warning::EMA's literature monitoring list could not be read; the last one is kept."

      # Individual case reports (collectors/cases, 0059): opens a case for every report a reviewer forwarded to the
      # PHAROS mailbox with CASE in the subject, reads every case still waiting (the app starts case-read.yml at
      # once; this is the safety net when GitHub could not be reached), and makes every E2B file asked for. Every
      # 4 hours, never on a dry run (a reading is real work on a real case). A failure is recorded on the case and
      # never fails the run.
      - name: Cases
        if: ${{ !cancelled() && (steps.which.outputs.schedule == '4h' || steps.which.outputs.schedule == 'all') && !inputs.dry_run }}
        timeout-minutes: 20
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PHAROS_IMAP_HOST: ${{ secrets.PHAROS_IMAP_HOST }}
          PHAROS_IMAP_PORT: ${{ secrets.PHAROS_IMAP_PORT }}
          PHAROS_IMAP_USER: ${{ secrets.PHAROS_IMAP_USER }}
          PHAROS_IMAP_PASSWORD: ${{ secrets.PHAROS_IMAP_PASSWORD }}
          # Claude by federation: identifiers (repository variables), not secrets.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python -m collectors.cases --mail --waiting || echo "::warning::Cases could not be read; the reason is on each case in Cases."

      # Packs on request (collectors/report_pack.py, 0048): a PSUR pack or an inspection pack asked for on Reports
      # is made by the next run, one request per run, in at most 15 minutes (a pack not finished waits for the next
      # run; after three tries it is marked failed). Always the last step, after the collection whatever it did;
      # never in the weekly run (its 90 minutes are the label watch's) nor the classes run. Chromium and the fonts
      # are installed only when a request waits. A failure is recorded on the request and never fails the run.
      # A dry run never makes a pack: it would take a real request, and the person who asked would not be told.
      - name: Packs waiting?
        id: packs
        if: ${{ !cancelled() && steps.which.outputs.schedule != 'weekly' && steps.which.outputs.schedule != 'classes' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          n=$(python -m collectors.report_pack --waiting 2>/dev/null | tail -n 1 || echo 0)
          [[ "$n" =~ ^[0-9]+$ ]] || n=0
          echo "Packs waiting: $n"
          if [ "$n" -gt 0 ]; then echo "waiting=true" >> "$GITHUB_OUTPUT"; else echo "waiting=false" >> "$GITHUB_OUTPUT"; fi
      - name: Fonts for packs (PDF)
        if: ${{ !cancelled() && steps.packs.outputs.waiting == 'true' }}
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: fonts-noto-core fonts-noto-cjk fonts-noto-ui-core
          version: "1"
      - name: Playwright browser for packs (cached)
        if: ${{ !cancelled() && steps.packs.outputs.waiting == 'true' && steps.which.outputs.browser != 'true' }}
        id: pw-cache-packs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('collectors/requirements.txt') }}
      - name: Playwright install for packs
        if: ${{ !cancelled() && steps.packs.outputs.waiting == 'true' && steps.which.outputs.browser != 'true' }}
        env:
          HIT: ${{ steps.pw-cache-packs.outputs.cache-hit }}
        run: |
          if [ "$HIT" != "true" ]; then python -m playwright install --with-deps chromium
          else python -m playwright install-deps chromium; fi
      - name: Packs on request
        if: ${{ !cancelled() && steps.packs.outputs.waiting == 'true' && !inputs.dry_run }}
        timeout-minutes: 20
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DRY: ${{ inputs.dry_run && '1' || '' }}
        run: |
          args=()
          [ -n "$DRY" ] && args+=(--dry-run)
          python -m collectors.report_pack "${args[@]}" || echo "::warning::A pack could not be made; the reason is on the request in Reports."
