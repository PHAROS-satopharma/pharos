# PHAROS — scheduled collection. ONE job per trigger; runs never overlap (shared "collectors" group with
# backfill). Times are UTC; Cairo is UTC+2 in winter and UTC+3 in summer.
#
#   4h       every 4 hours at :17        feeds, JSON, APIs, HTML lists, the PV mailbox (IMAP)
#   12h      05:47 and 17:47             browser-engine sources (Playwright)
#   daily    02:31                       drug classes from the ATC code (a manual run can choose "classes" to run
#                                        only that step); large JSON files (EMA medicines, Health
#                                        Canada recalls …) and NCBI literature (PubMed and PubMed Central); the
#                                        EURD list; the check of the past (15 minutes)
#   weekly   Monday 03:23                SPC / label watch, EMA's literature monitoring list
#   monthly  the 1st at 01:41            monthly sources (the report itself is report.yml)
#
# Telegram dry-run is NOT set here: the collectors read app_setting.telegram_dry_run (true until the owner
# approves the first real message). A manual run can force --dry-run.
name: PHAROS collect

on:
  schedule:
    - cron: "17 */4 * * *"
    - cron: "47 5,17 * * *"
    - cron: "31 2 * * *"
    - cron: "23 3 * * 1"
    - cron: "41 1 1 * *"
  # The database's back-up timer (supabase/migrations/0007) for a slot GitHub's cron skipped.
  repository_dispatch:
    types: [collect]
  workflow_dispatch:
    inputs:
      schedule:
        description: Which schedule to run
        type: choice
        options: ["4h", "12h", "daily", "weekly", "monthly", "all", "classes"]
        default: "4h"
      source:
        description: Only this source id (optional)
        type: string
        required: false
      dry_run:
        description: Force dry run (no Telegram, whatever the app setting says)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collectors
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    # daily: 60, for the drug classes before the collection and the check of the past after it
    timeout-minutes: ${{ (github.event.schedule == '23 3 * * 1' || github.event.client_payload.schedule == 'weekly') && 90 || (github.event_name == 'workflow_dispatch' && 120 || ((github.event.schedule == '31 2 * * *' || github.event.client_payload.schedule == 'daily') && 60 || 40)) }}
    env:
      # The collectors stop starting new notices and sources this many minutes in, so the run ends
      # cleanly (screening log, alerts, digest) instead of being killed by the timeout above.
      # Setup takes about 3 minutes; keep this about 10 below timeout-minutes.
      PHAROS_TIME_BUDGET_MIN: ${{ (github.event.schedule == '23 3 * * 1' || github.event.client_payload.schedule == 'weekly') && 78 || (github.event_name == 'workflow_dispatch' && 108 || 28) }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Which schedule
        id: which
        env:
          CRON: ${{ github.event.schedule }}
          INPUT_SCHEDULE: ${{ inputs.schedule || github.event.client_payload.schedule }}
        run: |
          case "$CRON" in
            "17 */4 * * *")  s=4h ;;
            "47 5,17 * * *") s=12h ;;
            "31 2 * * *")    s=daily ;;
            "23 3 * * 1")    s=weekly ;;
            "41 1 1 * *")    s=monthly ;;
            *)               s="${INPUT_SCHEDULE:-4h}" ;;
          esac
          case "$s" in 4h|12h|daily|weekly|monthly|all|classes) ;; *) echo "unknown schedule $s"; exit 1 ;; esac
          echo "schedule=$s" >> "$GITHUB_OUTPUT"
          # Only browser-engine runs need Playwright (12h, all, and the weekly SPC watch for JS-only sites).
          case "$s" in 12h|all|weekly) echo "browser=true" >> "$GITHUB_OUTPUT" ;; *) echo "browser=false" >> "$GITHUB_OUTPUT" ;; esac
          echo "Running schedule $s"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - name: PDF text and OCR (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            poppler-utils tesseract-ocr tesseract-ocr-jpn tesseract-ocr-kor tesseract-ocr-fin tesseract-ocr-swe
            tesseract-ocr-dan tesseract-ocr-nor tesseract-ocr-isl tesseract-ocr-deu tesseract-ocr-fra
            tesseract-ocr-ita tesseract-ocr-spa tesseract-ocr-por tesseract-ocr-nld tesseract-ocr-ara
          version: "1"

      - name: Python packages
        run: pip install -r collectors/requirements.txt

      - name: Playwright browser (cached)
        if: steps.which.outputs.browser == 'true'
        id: pw-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('collectors/requirements.txt') }}
      - name: Playwright install
        if: steps.which.outputs.browser == 'true'
        env:
          HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" != "true" ]; then python -m playwright install --with-deps chromium
          else python -m playwright install-deps chromium; fi

      # Drug classes from the ATC code (WHO's ATC index and Wikidata, collectors/classes.py), before the
      # collection so that a new ingredient's class words are looked for from this run on. A failure warns and
      # never fails the collection; that ingredient is tried again the next day.
      - name: Drug classes
        if: steps.which.outputs.schedule == 'daily' || steps.which.outputs.schedule == 'all' || steps.which.outputs.schedule == 'classes'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m collectors.classes || echo "::warning::Some drug classes could not be made; they are tried again tomorrow."

      - name: Collect
        if: steps.which.outputs.schedule != 'classes'
        env:
          # Secrets go to this step only, never to the job: the setup actions above never see them.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          PHAROS_IMAP_HOST: ${{ secrets.PHAROS_IMAP_HOST }}
          PHAROS_IMAP_PORT: ${{ secrets.PHAROS_IMAP_PORT }}
          PHAROS_IMAP_USER: ${{ secrets.PHAROS_IMAP_USER }}
          PHAROS_IMAP_PASSWORD: ${{ secrets.PHAROS_IMAP_PASSWORD }}
          SCHEDULE: ${{ steps.which.outputs.schedule }}
          SOURCE: ${{ inputs.source }}
          DRY: ${{ inputs.dry_run && '1' || '' }}
        run: |
          args=(--schedule "$SCHEDULE")
          if [ -n "$SOURCE" ]; then
            [[ "$SOURCE" =~ ^[a-z0-9-]+$ ]] || { echo "bad source id"; exit 1; }
            args+=(--source "$SOURCE")
          fi
          [ -n "$DRY" ] && args+=(--dry-run)
          python -m collectors.run "${args[@]}"

      # EMA's EURD list (PSUR frequencies and data lock points), once a day: the readiness line on the Ingredients
      # page and the weekly report read its rows. A failure warns and never fails the collection; an unchanged
      # list (same SHA-256) is not read again.
      - name: EURD list
        if: steps.which.outputs.schedule == 'daily' || steps.which.outputs.schedule == 'all'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m collectors.eurd || echo "::warning::The EURD list could not be read; the PSUR dates keep the last list."

      # The check of the past (collectors/rematch.py): words saved after the notices arrived (a new ingredient,
      # a new or changed name, a new class word) are looked for in the stored notices of the last 12 months, as
      # history: no Telegram message, no digest. 15 minutes a day; the next run continues where it stopped
      # (the "PHAROS check of the past" workflow runs it longer by hand). A failure warns and never fails the
      # collection.
      - name: Check of the past
        if: steps.which.outputs.schedule == 'daily'
        env:
          PHAROS_TIME_BUDGET_MIN: "15"
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m collectors.rematch || echo "::warning::The check of the past stopped with an error; the next run continues it."

      # EMA's medical literature monitoring list (which watched ingredients EMA screens itself), weekly. A
      # failure warns and never fails the collection; an unchanged list (same SHA-256) is not read again.
      - name: Literature monitoring list
        if: steps.which.outputs.schedule == 'weekly' || steps.which.outputs.schedule == 'all'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m collectors.mlm || echo "::warning::EMA's literature monitoring list could not be read; the last one is kept."
