# PHAROS — individual case reports, on a reviewer's click. Fired by the case-intake Edge Function
# (repository_dispatch 'case-read' when a case is opened or read again, 'case-e2b' when its E2B(R3) file is asked
# for) with only {case_id}; everything else is read from the database by collectors/cases, so nothing from the
# request is ever placed in a shell command. If this never fires, the "Cases" step of the next 4-hourly
# collection does the same work.
name: PHAROS case

on:
  repository_dispatch:
    types: [case-read, case-e2b]
  workflow_dispatch:
    inputs:
      case_id:
        description: The case's id (from the address of its page)
        required: true
      what:
        description: Read the document, or make the E2B file
        type: choice
        options: [read, e2b]
        default: read

permissions:
  contents: read

concurrency:
  group: case-${{ github.event.client_payload.case_id || inputs.case_id }}
  cancel-in-progress: false

jobs:
  case:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Check the case id
        id: which
        env:
          CASE_ID: ${{ github.event.client_payload.case_id || inputs.case_id }}
          EVENT: ${{ github.event.action || inputs.what }}
        run: |
          [[ "$CASE_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "not a case id"; exit 1; }
          case "$EVENT" in case-read|read) echo "flag=--case" >> "$GITHUB_OUTPUT" ;;
                           case-e2b|e2b)   echo "flag=--e2b" >> "$GITHUB_OUTPUT" ;;
                           *) echo "unknown event"; exit 1 ;; esac

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - run: pip install -r collectors/requirements.txt

      - name: Case
        env:
          # Secrets go to this step only, never to the job: the setup actions above never see them.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          CASE_ID: ${{ github.event.client_payload.case_id || inputs.case_id }}
          FLAG: ${{ steps.which.outputs.flag }}
        run: python -m collectors.cases "$FLAG" "$CASE_ID"
