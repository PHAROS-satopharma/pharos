# PHAROS — FDA adverse-event report counts (collectors/faers.py, migration 0065). openFDA counts the reports of the
# FDA Adverse Event Reporting System (FAERS) for every active ingredient: the reports per quarter for the last 8
# complete quarters, the most reported reactions, and every drug's for comparison. FAERS changes once a quarter, so
# this runs weekly and an ingredient counted in the last 6 days is left; "force" counts every ingredient again. Only
# numbers come back and the log names no ingredient. OPENFDA_API_KEY is optional: without it openFDA allows 40
# requests a minute and lists at most 100 reactions per request.
name: PHAROS FAERS counts

on:
  schedule:
    - cron: "13 2 * * 3"     # Wednesday 04:13 Cairo (05:13 in summer)
  workflow_dispatch:
    inputs:
      force:
        description: Count every ingredient again, even one counted in the last 6 days
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: faers
  cancel-in-progress: false

jobs:
  faers:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - name: Python packages
        run: pip install -r collectors/requirements.txt

      # Starts no ingredient after 45 minutes; what is left is counted the next week (or by a run by hand).
      - name: FAERS counts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python -m collectors.faers --minutes 45 $FORCE
