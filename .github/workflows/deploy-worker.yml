# PHAROS — OPTIONAL email Worker (workers/email-inbound). Only needed if the mail domain's DNS is ever on
# Cloudflare; today the collectors read pharos@satopharma.com over IMAP instead. Runs only when started by hand.
name: PHAROS deploy email Worker (optional)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: workers/email-inbound
      - uses: cloudflare/wrangler-action@v4.1.3
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORWARD_TO: ${{ secrets.PV_MAILBOX }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          workingDirectory: workers/email-inbound
          command: deploy
          secrets: |
            SUPABASE_URL
            SUPABASE_SERVICE_ROLE_KEY
            FORWARD_TO
