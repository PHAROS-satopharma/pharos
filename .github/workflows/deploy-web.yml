# PHAROS — build the web app and publish it to Cloudflare Pages (project "pharos-satopharma") after "PHAROS CI" has
# passed on a push to main that touches web/. Never from another branch: a run started by hand works on
# main only. The site is built here, so the Cloudflare Pages project needs no environment variables.
name: PHAROS deploy web

on:
  workflow_run:
    workflows: ["PHAROS CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    # A manual run: main only. Otherwise: CI passed on a push to main in this repository.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      # The commit CI tested, against its first parent (the whole pull request for a merge commit).
      # A manual run always deploys.
      - name: What changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run: deploying."; echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git rev-parse -q --verify 'HEAD^1' > /dev/null; then
            echo "No parent commit: deploying."; echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only 'HEAD^1' HEAD)"
          echo "$files"
          if echo "$files" | grep -qE '^(web/|\.github/workflows/deploy-web\.yml$)'; then deploy=true; else deploy=false; fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy"

      - if: steps.changes.outputs.deploy == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        if: steps.changes.outputs.deploy == 'true'
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html

      - name: Create the Pages project the first time (ignored if it exists)
        if: steps.changes.outputs.deploy == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          command: pages project create pharos-satopharma --production-branch=main

      - name: Publish to Cloudflare Pages
        if: steps.changes.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=pharos-satopharma --branch=main --commit-hash=${{ env.DEPLOY_SHA }}
