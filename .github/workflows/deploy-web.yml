# PHAROS — build the web app and publish it to Cloudflare Pages (project "pharos-satopharma") after "PHAROS CI" has
# passed on a push to main, when web/ changed since the commit that is live. Only main's current tip is ever
# published: a CI run for an older commit that finishes after a newer merge skips, and the tip's own run
# deploys everything since the live commit. Never from another branch: a run started by hand works on
# main only. The site is built here, so the Cloudflare Pages project needs no environment variables.
name: PHAROS deploy web

on:
  workflow_run:
    workflows: ["PHAROS CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  # Never cancel a publish in progress: a later run may be for an older commit (a re-run CI) and would skip.
  cancel-in-progress: false

jobs:
  deploy:
    # A manual run: main only. Otherwise: CI passed on a push to main in this repository.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # Full history without file contents: enough to diff against whichever commit is live.
          fetch-depth: 0
          filter: blob:none

      # Skip unless this is main's tip, then deploy when web/ (or this file) changed since the live commit —
      # not only in this commit, since merges whose own deploy skipped are published by the tip's run.
      # A manual run (main only) always deploys; so does a run that cannot tell what is live.
      - name: What changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          out() { echo "deploy=$1" >> "$GITHUB_OUTPUT"; echo "deploy=$1"; exit 0; }
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "Manual run: deploying."; out true; fi
          git fetch -q --filter=blob:none origin main
          tip="$(git rev-parse FETCH_HEAD)"
          echo "CI passed on $DEPLOY_SHA; main's tip is $tip."
          if [ "$DEPLOY_SHA" != "$tip" ]; then
            echo "::notice::Skipped: $DEPLOY_SHA is no longer main's tip ($tip); the tip's own run publishes it."
            out false
          fi
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/pharos-satopharma"
          live="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" |
            jq -r '.result.canonical_deployment.deployment_trigger.metadata.commit_hash // empty' || true)"
          echo "Live commit: ${live:-unknown}"
          if [ -z "$live" ] || ! git merge-base --is-ancestor "$live" HEAD 2> /dev/null; then
            echo "Live commit unknown or not in main's history: deploying."; out true
          fi
          files="$(git diff --name-only "$live" HEAD)"
          echo "$files"
          if echo "$files" | grep -qE '^(web/|\.github/workflows/deploy-web\.yml$)'; then out true; else out false; fi

      - if: steps.changes.outputs.deploy == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        if: steps.changes.outputs.deploy == 'true'
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html

      - name: Create the Pages project the first time (ignored if it exists)
        if: steps.changes.outputs.deploy == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          command: pages project create pharos-satopharma --production-branch=main

      - name: Publish to Cloudflare Pages
        if: steps.changes.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=pharos-satopharma --branch=main --commit-hash=${{ env.DEPLOY_SHA }}
