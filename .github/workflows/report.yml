# PHAROS — daily report (XLSX + PDF) of the day before, every morning at 07:00 Cairo (owner, 6 Nov 2026: "there
# must be also a daily report with the outcome"), and the weekly report for the week that has just ended (Sunday
# to Saturday, Cairo), every Sunday at 05:00 Cairo (Dr Sama's review, 6 Nov 2026: some findings must reach the
# EDA within 5 days, so the monthly report came too late). The weekly report is the one signed. By hand: a day, a
# week (its Sunday), or a month in the format used until November 2026.
# GitHub cron is UTC only, and Cairo is UTC+2 in winter and UTC+3 in summer, so each report has two triggers and
# the job keeps the one that is on the hour in Cairo today (decided by the UTC offset, so a late start never
# produces a second report).
name: PHAROS daily and weekly report

on:
  schedule:
    - cron: "0 2 * * 0"   # Sunday 05:00 Cairo in summer (UTC+3)
    - cron: "0 3 * * 0"   # Sunday 05:00 Cairo in winter (UTC+2)
    - cron: "0 4 * * *"   # every day 07:00 Cairo in summer (UTC+3): the daily report of the day before
    - cron: "0 5 * * *"   # every day 07:00 Cairo in winter (UTC+2)
  workflow_dispatch:
    inputs:
      day:
        description: Or a daily report of this day, YYYY-MM-DD (leave the week and month empty)
        type: string
        required: false
      week:
        description: Week to report, its Sunday as YYYY-MM-DD (empty = the week that has just ended)
        type: string
        required: false
      month:
        description: Or a month in the old monthly format, YYYY-MM (leave the week empty)
        type: string
        required: false
      preview_key:
        description: >-
          A preview of a day or week on a new look: an age public key (age1…). The files are not archived,
          recorded or sent; they are encrypted to this key and kept one day as the run's artifact
        type: string
        required: false

permissions:
  contents: read

# Its own group: in the shared "collectors" group a newer waiting collect run would cancel the waiting
# report (GitHub keeps only one waiting run per group), and nothing would ever retry it. The report only
# reads, so running beside a collection is safe.
concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Is it the report's hour in Cairo?
        id: gate
        env:
          CRON: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          go=false
          daily=false
          if [ "$EVENT" = "workflow_dispatch" ]; then go=true
          else
            offset="$(TZ=Africa/Cairo date +%z)"
            { [ "$offset" = "+0300" ] && [ "$CRON" = "0 2 * * 0" ]; } && go=true
            { [ "$offset" = "+0200" ] && [ "$CRON" = "0 3 * * 0" ]; } && go=true
            if { [ "$offset" = "+0300" ] && [ "$CRON" = "0 4 * * *" ]; } ||
               { [ "$offset" = "+0200" ] && [ "$CRON" = "0 5 * * *" ]; }; then go=true; daily=true; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "daily=$daily" >> "$GITHUB_OUTPUT"
          echo "Cairo offset $(TZ=Africa/Cairo date +%z), trigger '$CRON' → go=$go, daily=$daily"

      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - name: Fonts for originals in every script (PDF)
        if: steps.gate.outputs.go == 'true'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: fonts-noto-core fonts-noto-cjk fonts-noto-ui-core
          version: "1"

      - if: steps.gate.outputs.go == 'true'
        run: pip install -r collectors/requirements.txt

      - if: steps.gate.outputs.go == 'true'
        id: pw-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('collectors/requirements.txt') }}
      - name: Playwright install
        if: steps.gate.outputs.go == 'true'
        env:
          HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" != "true" ]; then python -m playwright install --with-deps chromium
          else python -m playwright install-deps chromium; fi

      - name: Build and store the report
        if: steps.gate.outputs.go == 'true'
        env:
          # Secrets go to this step only, never to the job: the setup actions above never see them.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DAILY: ${{ steps.gate.outputs.daily }}
          DAY: ${{ inputs.day }}
          WEEK: ${{ inputs.week }}
          MONTH: ${{ inputs.month }}
          PREVIEW_KEY: ${{ inputs.preview_key }}
          REPORT_DIR: ${{ runner.temp }}/report
        run: |
          # A preview: the report of a day or week built into REPORT_DIR only, then encrypted (the repository is
          # public, so a readable file never leaves the runner).
          if [ -n "$PREVIEW_KEY" ]; then
            [[ "$PREVIEW_KEY" =~ ^age1[0-9a-z]{58}$ ]] || { echo "preview_key must be an age public key"; exit 1; }
            if [ -n "$DAY" ]; then python -m collectors.report --preview --day "$DAY"
            elif [ -n "$WEEK" ]; then python -m collectors.report --preview --week "$WEEK"
            else echo "a preview needs a day or a week"; exit 1; fi
            sudo apt-get install -y -qq age > /dev/null
            mkdir -p "$RUNNER_TEMP/sealed"
            for f in "$REPORT_DIR"/*; do age -r "$PREVIEW_KEY" -o "$RUNNER_TEMP/sealed/$(basename "$f").age" "$f"; done
            rm -rf "$REPORT_DIR"
            exit 0
          fi
          given=0
          for v in "$DAY" "$WEEK" "$MONTH"; do [ -n "$v" ] && given=$((given + 1)); done
          if [ "$given" -gt 1 ]; then echo "give a day, a week or a month, only one"; exit 1; fi
          if [ "$DAILY" = "true" ]; then
            python -m collectors.report --daily
          elif [ -n "$DAY" ]; then
            [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "day must be YYYY-MM-DD"; exit 1; }
            python -m collectors.report --day "$DAY"
          elif [ -n "$WEEK" ]; then
            [[ "$WEEK" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "week must be YYYY-MM-DD, its Sunday"; exit 1; }
            python -m collectors.report --week "$WEEK"
          elif [ -n "$MONTH" ]; then
            [[ "$MONTH" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]] || { echo "month must be YYYY-MM"; exit 1; }
            python -m collectors.report --month "$MONTH"
          else
            python -m collectors.report
          fi

      - name: The sealed preview
        if: steps.gate.outputs.go == 'true' && inputs.preview_key != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-preview
          path: ${{ runner.temp }}/sealed/*.age
          retention-days: 1
          if-no-files-found: error
