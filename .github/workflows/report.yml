# PHAROS — weekly report (XLSX + PDF) for the week that has just ended (Sunday to Saturday, Cairo), every
# Sunday at 05:00 Cairo (Dr Sama's review, 6 Nov 2026: some findings must reach the EDA within 5 days, so the
# monthly report came too late). By hand: a week (its Sunday), or a month in the format used until November 2026.
# GitHub cron is UTC only, and Cairo is UTC+2 in winter and UTC+3 in summer, so there are two triggers and
# the job keeps the one that is 05:00 in Cairo today (decided by the UTC offset, so a late start never
# produces a second report).
name: PHAROS weekly report

on:
  schedule:
    - cron: "0 2 * * 0"   # Sunday 05:00 Cairo in summer (UTC+3)
    - cron: "0 3 * * 0"   # Sunday 05:00 Cairo in winter (UTC+2)
  workflow_dispatch:
    inputs:
      week:
        description: Week to report, its Sunday as YYYY-MM-DD (empty = the week that has just ended)
        type: string
        required: false
      month:
        description: Or a month in the old monthly format, YYYY-MM (leave the week empty)
        type: string
        required: false

permissions:
  contents: read

# Its own group: in the shared "collectors" group a newer waiting collect run would cancel the waiting
# report (GitHub keeps only one waiting run per group), and nothing would ever retry it. The report only
# reads, so running beside a collection is safe.
concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Is it 05:00 in Cairo?
        id: gate
        env:
          CRON: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          go=false
          if [ "$EVENT" = "workflow_dispatch" ]; then go=true
          else
            offset="$(TZ=Africa/Cairo date +%z)"
            { [ "$offset" = "+0300" ] && [ "$CRON" = "0 2 * * 0" ]; } && go=true
            { [ "$offset" = "+0200" ] && [ "$CRON" = "0 3 * * 0" ]; } && go=true
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "Cairo offset $(TZ=Africa/Cairo date +%z), trigger '$CRON' → go=$go"

      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - name: Fonts for originals in every script (PDF)
        if: steps.gate.outputs.go == 'true'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: fonts-noto-core fonts-noto-cjk fonts-noto-ui-core
          version: "1"

      - if: steps.gate.outputs.go == 'true'
        run: pip install -r collectors/requirements.txt

      - if: steps.gate.outputs.go == 'true'
        id: pw-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('collectors/requirements.txt') }}
      - name: Playwright install
        if: steps.gate.outputs.go == 'true'
        env:
          HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" != "true" ]; then python -m playwright install --with-deps chromium
          else python -m playwright install-deps chromium; fi

      - name: Build and store the report
        if: steps.gate.outputs.go == 'true'
        env:
          # Secrets go to this step only, never to the job: the setup actions above never see them.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEEK: ${{ inputs.week }}
          MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$WEEK" ] && [ -n "$MONTH" ]; then echo "give a week or a month, not both"; exit 1; fi
          if [ -n "$WEEK" ]; then
            [[ "$WEEK" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "week must be YYYY-MM-DD, its Sunday"; exit 1; }
            python -m collectors.report --week "$WEEK"
          elif [ -n "$MONTH" ]; then
            [[ "$MONTH" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]] || { echo "month must be YYYY-MM"; exit 1; }
            python -m collectors.report --month "$MONTH"
          else
            python -m collectors.report
          fi
