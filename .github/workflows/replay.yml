# PHAROS — replay a real past revision of a label through the label watch's change detector (dry run: nothing
# stored, no message). collectors/spc/replay.py. Run by hand with a DailyMed set id and two versions, a Korean
# item code and a Dutch RVG number; a pull request that changes the replay runs the Corlanor 2019 paediatric
# revision (versions 16 and 20), the Procoralan 2017 revision in Korea (item 200906066) and the Carivalan 2024
# revision in the Netherlands (RVG 117810) once. It then reads the European label databases live, the way the
# weekly run does (collectors/spc/read_check.py, dry run as well).
name: PHAROS label change replay

on:
  pull_request:
    paths: [collectors/spc/replay.py, collectors/spc/read_check.py, collectors/spc/nedrug.py, collectors/spc/cbg.py,
            collectors/spc/famhp.py, collectors/spc/aifa.py, collectors/spc/mpa.py, collectors/spc/infomed.py,
            collectors/spc/hpra.py, collectors/spc/basg.py, collectors/spc/lyfja.py, collectors/spc/sections.py,
            .github/workflows/replay.yml]
  workflow_dispatch:
    inputs:
      setid:
        description: DailyMed set id
        type: string
        default: 92018a65-38f6-45f7-91d4-a34921b81d0d
      from_version:
        description: The older version
        type: string
        default: "16"
      to_version:
        description: The newer version
        type: string
        default: "20"
      korea_item:
        description: Korean item code (nedrug 품목기준코드)
        type: string
        default: "200906066"
      cbg_rvg:
        description: Dutch RVG number (CBG)
        type: string
        default: "117810"

permissions:
  contents: read

concurrency:
  group: replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: poppler-utils tesseract-ocr
          version: "1"

      - run: pip install -r collectors/requirements.txt

      - name: Replay
        env:
          SETID: ${{ inputs.setid || '92018a65-38f6-45f7-91d4-a34921b81d0d' }}
          FROM: ${{ inputs.from_version || '16' }}
          TO: ${{ inputs.to_version || '20' }}
        run: |
          [[ "$SETID" =~ ^[0-9a-f-]{36}$ && "$FROM" =~ ^[0-9]{1,4}$ && "$TO" =~ ^[0-9]{1,4}$ ]] || { echo "not a set id and two versions"; exit 2; }
          python -m collectors.spc.replay dailymed "$SETID" "$FROM" "$TO"

      - name: Replay Korea
        env:
          ITEM: ${{ inputs.korea_item || '200906066' }}
        run: |
          [[ "$ITEM" =~ ^[0-9]{6,12}$ ]] || { echo "not an item code"; exit 2; }
          python -m collectors.spc.replay nedrug "$ITEM"

      - name: Replay the Netherlands
        if: ${{ !cancelled() }}
        env:
          RVG: ${{ inputs.cbg_rvg || '117810' }}
        run: |
          [[ "$RVG" =~ ^[0-9]{3,7}$ ]] || { echo "not an RVG number"; exit 2; }
          python -m collectors.spc.replay cbg "$RVG"

      - name: Read the European label databases
        if: ${{ !cancelled() }}
        run: python -m collectors.spc.read_check
