# PHAROS — the check of the past, by hand (collectors/rematch.py).
#
# Words saved after the notices arrived (a new ingredient, a new or changed name, an ingredient watched again,
# a new class word) are looked for in the stored notices, as history: no Telegram message, no digest. The daily
# collection (collect.yml) runs it for 15 minutes a day; this runs it for up to 45 minutes at once, for example
# right after a new ingredient was added. It continues an open check where it stopped; "months" only sets how
# far back a NEW check goes. Never at the same time as a collection (shared "collectors" group).
name: PHAROS check of the past

on:
  workflow_dispatch:
    inputs:
      months:
        description: How many months back a new check goes (an open check keeps its own)
        type: string
        default: "12"

permissions:
  contents: read

concurrency:
  group: collectors
  cancel-in-progress: false

jobs:
  rematch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # It starts no new batch of notices after this; setup takes about 3 minutes.
      PHAROS_TIME_BUDGET_MIN: "45"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - name: PDF text and OCR (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            poppler-utils tesseract-ocr tesseract-ocr-jpn tesseract-ocr-kor tesseract-ocr-fin tesseract-ocr-swe
            tesseract-ocr-dan tesseract-ocr-nor tesseract-ocr-isl tesseract-ocr-deu tesseract-ocr-fra
            tesseract-ocr-ita tesseract-ocr-spa tesseract-ocr-por tesseract-ocr-nld tesseract-ocr-ara
          version: "1"

      - name: Python packages
        run: pip install -r collectors/requirements.txt

      - name: Check of the past
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MONTHS: ${{ inputs.months }}
        run: |
          [[ "$MONTHS" =~ ^[0-9]{1,3}$ ]] && [ "$MONTHS" -ge 1 ] || { echo "months must be a whole number from 1"; exit 1; }
          python -m collectors.rematch --months "$MONTHS" --trigger manual
