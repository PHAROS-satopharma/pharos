      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[&lt;sup&gt;*&lt;/sup&gt; 자발 보고로부터 확인된 이상반응에 대해 임상시험에서 계산된 발생 빈도]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[3) 특정 이상반응]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[발광 현상(안내 섬광)은 환자의 14.5%에서 보고되었으며, 시야의 국한된 부분에서 일시적으로 강해진 밝음으로 설명된다. 이러한 현상은 빛 강도의 갑작스러운 변동에 의해서 보통 유발된다. 또한, 안내 섬광은 후광(halo), 이미지 분해(stroboscopic 또는 kaleidoscopic effects), 유색 섬광(coloured bright lights), 또는 한 개의 물체가 여러 개로 보이는 것(retinal persistency)으로써 설명될 수도 있다. 안내 섬광의 발현은 일반적으로 투여 후 2개월 이내에 발생하며 이후 반복적으로 발생할 수 있다. 안내 섬광의 강도는 대체로 경도 내지 중등도인 것으로 보고되었다. 모든 안내 섬광은 투여 중 또는 투여 종료 후 회복되었으며, 대부분(77.5%)의 경우 투약 기간 중 회복되었다. 안내 섬광과 관련하여 일상생활이 변화하거나 투여를 중단한 환자는 1% 미만이었다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[환자의 3.3%가 특히 투여시작 후 2개월 내지 3개월 이내에 서맥을 보고하였다. 환자의 0.5%는 40 bpm 이하의 중증의 서맥을 경험하였다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[SIGNIFY 임상시험에서 심방세동은 위약군에서 3.8%였고, 이 약을 투여하는 환자에서는 5.3%로 관찰되었다. 40,000명 이상의 환자를 포함하는 최소 3개월동안의 모든 2상/3상 이중눈가림 임상시험의 통합 분석(pooled analysis)에서, 대조군의 심방세동 발생률은 4.08%였고, 이 약을 투여한 환자에서는 4.86%였다. 또한 위험비 (hazard ratio)는 1.26이고, 95% 신뢰구간은 1.15-1.39를 나타내었다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[4) 국내 시판 후 조사 결과]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[가. 국내에서 재심사를 위하여 6년 동안 612명을 대상으로 실시한 시판 후 조사 결과, 이상사례의 발현율은 인과관계와 상관없이 22.71%(139/612명, 총 231건)로 보고되었다. 이 중 중대한 이상사례의 발현율은 8.99%(55/612명, 68건)로 심부전악화 1.96%(12/612명, 13건), 호흡곤란 1.63%(10/612명, 10건), 심방세동 0.82%(5/612명, 5건), 복통 0.33%(2/612명, 3건), 가슴통증, 대변내혈액, 무력증, 사망, 심근병증, 심장정지, 패혈증, 흉막삼출 각 0.33%(2/612명, 2건), 만성폐쇄성기도질환악화 0.16%(1/612명, 2건), 구토, 뇌경색, 당뇨병, 동맥류, 서맥, 심방성빈맥, 심실성빈맥, 심장막삼출, 연하곤란, 위장관출혈, 저칼륨혈증, 저혈압, 질소혈증, 천식, 폐렴, 폐부종, 폐섬유증, 혈종, 호흡곤란악화 각 0.16%(1/612명, 1건)가 보고되었다. 이 약과 인과관계를 배제할 수 없는 중대한 약물이상반응은 1.80%(11/612명, 총 12건)로 심방세동 0.65%(4/612명, 4건), 호흡곤란 0.33%(2/612명, 2건), 서맥, 심방성빈맥, 심부전악화, 심실성빈맥, 호흡곤란악화, 흉막삼출 각 0.16%(1/612명, 1건)가 보고되었다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[예상하지 못한 이상사례의 발현율은 인과관계와 상관없이 13.73%(84/612명, 129건)로 보고되었으며, 심부전악화1.96%(12/612명, 13건), 가슴통증 1.63%(10/612명, 10건), 기침 1.31%(8/612명, 8건), 소화불량 0.82%(5/612명, 5건), 고칼륨혈증, 구토, 상기도감염, 식욕부진, 열, 위식도역류, 흉막삼출 각 0.49%(3/612명, 3건), 저칼륨혈증, 폐부종 각 0.33%(2/612명, 3건), 다리통증, 대변내혈액, 말초부종, 비염, 빈뇨, 사망, 심근병증, 심장정지, 인두염, 저칼슘혈증, 체온감각변화, 패혈증, 폐렴, ALT증가, AST증가 각 0.33%(2/612명, 2건), 다리무력증, 만성폐쇄성기도질환악화 각 0.16%(1/612명, 2건), 갈증, 감각이상, 감각저하, 건성안, 고혈압, 근육통, 관절통, 귀울림, 뇌경색, 당뇨병, 동맥류, 등통증, 만성폐쇄성기도질환, 바이러스감염, 복부비대, 빈혈, 심막염, 심방성빈맥, 심실성빈맥, 심장막삼출, 안검염, 여성형유방, 연하곤란, 위염, 위장관출혈, 저나트륨혈증, 천식, 치질, 체중감소, 핍뇨, 폐섬유증, 혈종 각 0.16%(1/612명, 1건)로 조사되었다. 이 중, 이 약과 인과관계를 배제할 수 없는 예상하지 못한 약물이상반응 발현율은 1.96%(12/612명, 13건)로 가슴통증 0.65%(4/612명, 4건), 소화불량 0.33%(2/612명, 2건), 말초부종, 심방성빈맥, 심부전악화, 심실성빈맥, 위식도역류, 핍뇨, 흉막삼출 각 0.16%(1/612명, 1건)가 보고되었다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[나. 재심사 이상사례 분석평가 결과]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약에 대한 국내 재심사 이상사례 및 자발적 부작용 보고자료를 국내 시판 허가된 모든 의약품을 대상으로 보고된 이상사례 보고자료와 재심사 종료시점에서 통합평가한 결과, 다른 모든 의약품에서 보고된 이상사례에 비해 이 약에서 통계적으로 유의하게 많이 보고된 이상사례 중 새로 확인된 것들은 없었다.]]&gt;&lt;/PARAGRAPH&gt;
    &lt;/ARTICLE&gt;
    &lt;ARTICLE title=&quot;4. 일반적 주의&quot;&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[1) 심박수 측정]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[심박수는 시간이 지남에 따라 크게 변할 수 있으므로, 이 약의 치료 개시 전 또는 이 약 투여 중 용량 조절이 고려되는 환자에서 안정 시 심박수를 측정할 때에는 연속 심박수 측정, 심전도 및 24시간 활동 모니터링(ambulatory 24-hour monitoring)을 고려해야 한다. 이는 또한 심박수가 낮은 환자, 특히 심박수가 분당 50회 미만으로 감소할 때 또는 용량 감량 이후에도 적용된다(‘용법용량’ 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[2) 심장 부정맥 환자]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약은 부정맥의 치료 또는 예방에는 효과적이지 않으며, 빈맥이 발생할 경우 이 약의 유효성이 소실될 가능성도 있다(심실 또는 심실위 빈맥). 따라서, 심방세동이 있거나 동결절(sinus node)의 기능을 저해하는 부정맥이 있는 환자에게 이 약은 권장되지 않는다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약을 투여받는 환자에서 심방세동 발병 위험이 증가한다.(‘3. 이상반응’항 참조). 심방세동은 아미오다론 또는 강력한 class Ⅰ 항부정맥제를 병용 투여한 환자에서 더 흔하게 나타났다. 이 약을 투여받은 환자에게는 심방 세동 발생(지속성 또는 발작성)에 대하여 정기적인 임상 모니터링이 권장되며, 임상적 징후(협심증의 악화, 가슴 두근거림, 불규칙적인 맥박)가 보이는 경우 심전도 모니터링도 실시한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[환자에게는 심방세동의 징후 및 증상에 대해 알려야 하며 이러한 증상 발생 시에 담당의사에게 연락하도록 권고해야 한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[만약 심방세동이 치료 도중 발생한다면, 이 약의 지속적인 투여에 대한 치료의 유익성과 위험성의 균형을 다시 신중히 고려해야 한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[심실내 전도 장애(좌측속지차단, 우측속지차단) 및 심실동기이상이 있는 만성 심부전 환자는 면밀하게 모니터해야 한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[3) 2도 방실차단(AV-block) 환자]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[2도 방실차단(AV-block) 환자에게 이 약이 권장되지 않는다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[4) 심박수가 낮은 환자]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약을 투여하기 전 안정시 심박수가 분당 70회 미만인 환자에게 이 약을 투여해서는 안 된다. (&#39;1. 다음 환자에는 투여하지 말 것&#39;항 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약 투여 중 안정시 심박수가 지속적으로 분당 50회 미만으로 감소하거나, 서맥 증상 (예: 어지러움, 피로, 저혈압 등)이 나타나는 경우 용량을 순차적으로 감량하여야 하며, 분당 50회 미만의 심박수 또는 서맥증상이 지속되는 경우 투여를 중단하여야 한다. (&#39;용법&amp;#x2024;용량&#39;항 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[5) 칼슘채널차단제와의 병용투여]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약과 베라파밀 또는 딜티아젬 등 심박수를 감소시키는 칼슘채널차단제를 병용투여해서는 안 된다.(‘1.다음 환자에는 투여하지 말 것’, ‘5.상호작용’ 항 참조). 이 약과 니트레이트 및 암로디핀 등의 디히드로피리딘계 칼슘채널차단제와 병용투여시 안전성 관련 문제가 보고된 바 없다. 디히드로피리딘계 칼슘채널차단제와 병용투여시 이 약의 상가효과는 입증되지 않았다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[6) 만성 심부전]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약은 심부전이 안정 상태일 때에만 투여되어야 한다. 이약은 NYHA Class IV 등급의 심부전 환자에서의 정보가 제한적이므로 주의하여 사용하여야 한다. 만성 심부전 환자 6,505명을 대상으로 한 연구 (SHIFT 연구)에서 기저치 심박수가 높을수록, 병용투여한 베타차단제의 용량이 낮을수록 이 약의 효과가 증가하였다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[7) 뇌졸중 환자]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[뇌졸중에 대한 유용한 자료가 없으므로, 뇌졸중이 일어난 직후 이 약을 투여하는 것은 권장하지 않는다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[8) 시각 기능]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약은 망막 기능에 영향을 미친다. 이 약의 장기 투여 시 망막에 대한 독성 효과를 입증하는 근거는 없다. 예상하지 못한 시각 기능 저하가 발생할 경우 투여 중단을 고려한다. 이 약을 망막색소변성이 있는 환자에게 투여시 주의하여야 한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[9) 저혈압 환자]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[경증 또는 중등증의 저혈압 환자에 대한 연구 자료가 제한적이므로, 이 약을 주의하여 투여해야 한다. 중증의 저혈압 환자(혈압이 90/50mmHg 미만)에 이 약을 투여해서는 안 된다 (1. 다음 환자에는 투여하지 말 것 항 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[10) 심방 세동-심장 부정맥]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약을 투여 받은 환자에서 약리학적 심장율동전환(cardioversion)가 시작되었을 때 동리듬(sinus rhythm) 회복 시 (과다한) 서맥의 위험에 관한 증거는 없다. 광범위한 자료는 없으나, 이 약의 최종 투여 후 24시간 동안 긴급하지 않은 직접적인 전류의 심장율동전환(non urgent DC-cardioverson)이 발생하는 것을 고려한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[11) 선천성 QT증후군 또는 QT 연장 약물을 투여하는 환자]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약은 선천성 QT 증후군이 있거나 QT 연장 약물을 투여하는 환자에게는 사용하지 않는다(&#39;5. 상호작용&#39; 항 참조). 병용투여가 필요한 경우, 면밀한 심장 모니터링이 필요하다. 이 약으로 인한 심박수 감소는 QT 연장을 더욱 악화시킬 수 있으며, 특히 Torsade de pointes에서 중증의 부정맥을 발생시킬 수 있다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[12) 혈압 치료제 변경을 요하는 고혈압 환자]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[SHIFT 임상시험에서 위약(6.1%)을 투여한 환자와 비교하여 이 약(7.1%)을 투여하는 동안 더 많은 환자가 혈압 증가 사례를 경험하였다. 이들 사례는 혈압 치료제가 변경된 직후 가장 빈번하게 발생하였고, 일시적이었으며, 이 약의 치료 효과에 영향을 미치지 않았다. 이 약을 투여하는 만성 심부전 환자에서 치료제를 변경할 때는 적절한 간격으로 혈압을 모니터해야 한다(사용상의 주의사항 중 3. 이상반응 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[13) 이 약은 만성심부전에 대한 치료경험이 많은 의사를 통해 사용되는 것이 권장된다.]]&gt;&lt;/PARAGRAPH&gt;
    &lt;/ARTICLE&gt;
    &lt;ARTICLE title=&quot;5. 상호작용&quot;&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[약물상호작용 연구는 성인만을 대상으로 실시되었다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[1) 약력학적 상호작용]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[가. 병용투여가 권장되지 않는 약물]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[① QT를 연장시키는 약물]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[- 심혈관성 QT 연장 약물(예: 퀴니딘, 디소피라미드, 베프리딜, 소타롤, 이부틸라이드, 아미오다론)]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[- 비 심혈관성 QT 연장 약물(예: 피모지드, 지프라시돈, 세틴돌, 메플로퀸, 할로판드린, 펜타미딘, 시사프라이드, 정주용 에리트로마이신)]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[심박수 감소로 QT 연장이 악화될 수 있으므로 심혈관성 및 비심혈관성 QT 연장 약물과 이 약의 병용 투여를 피한다. 병용 투여가 필요한 경우에는 정밀한 심장 모니터링이 필요하다(&#39;3. 이상반응&#39;항 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[나. 병용투여시 주의가 필요한 약물]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[칼륨고갈성이뇨제(티아지드계 이뇨제 및 루프성 이뇨제):저칼륨혈증은 부정맥의 위험성을 증가시킬 수 있다. 이 약은 서맥을 유발할 수 있으므로, 저칼륨혈증과 서맥이 동반되면 중증의 부정맥 발생을 초래할 수 있다. 선천성인지 혹은 물질에 의해 유도되었는지에 관계없이 QT 증후군 환자에서 위험성이 증가한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[2) 약동학적 상호작용]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[가. 사이토크롬 P450 3A4(CYP3A4)]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약은 CYP3A4에 의해서만 대사되며, 이 효소의 매우 약한 저해제이다. 이 약은 CYP3A4의 다른 기질 약물들(경미하거나, 중등도 및 강력한 저해제 모두 포함)의 대사 및 혈장농도에 영향을 미치지 않았다. CYP3A4 저해제 및 유도제들은 이 약과 임상적으로 유의한 수준의 상호작용을 나타내어 이 약의 대사 및 약동학에 영향을 미친다. 약물상호작용에 대한 연구는 CYP3A4 저해제가 이 약의 혈장농도를 증가시키고 CYP3A4 유도제들은 이 약의 혈중농도를 감소시킴이 보고되었다. 이 약의 증가된 혈중 농도는 과도한 서맥의 위험과 관련될 수 있다(&#39;3. 이상반응&#39;항 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[나. 병용 투여 금기인 약물]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약은 아졸계 항진균제(케토코나졸, 이트라코나졸), 마크로라이드계 항생제(클래리트로마이신, 에리트로마이신, 조사마이신, 텔리트로마이신), HIV 단백분해효소 저해제(넬피나비르, 리토나비르)와 같은 강력한 CYP3A4 억제제 및 네파조돈과 병용 투여해서는 안 된다(&#39;1. 다음 환자에는 투여하지 말 것&#39;항 참조). 강력한 CYP3A4 저해제인 케토코나졸 (1일 1회 200 밀리그램 투여) 및 조사마이신(1일 2회 1그램 투여)은 이 약의 평균 혈장 농도를 7~8배 증가시켰다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[중등도의 CYP3A4 저해제 : 건강한 피험자 및 환자를 대상으로 약물상호작용 연구한 결과, 심박수를 감소시키는 약물인 딜티아젬 또는 베라파밀과 이 약을 병용 투여하는 경우, 이 약의 혈중 약물 농도가 증가되었으며(AUC의 2~3배 증가), 심박수 5 bpm이 추가로 감소되었다. 따라서, 이러한 약물들과 이 약을 병용투여해서는 안 된다. (‘1. 다음 환자에 투여하지 말 것’항 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[다. 병용투여가 권장되지 않는 약물]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[자몽주스: 이 약을 자몽주스와 동시에 복용 시 이 약의 노출이 2배 증가하였다. 따라서 자몽주스의 섭취를 피해야 한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[라. 병용투여시 주의가 필요한 약물]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[① 중등도의 CYP3A4 저해제: 다른 중등도의 CYP3A4 저해제(예: 플루코나졸)와 이 약의 병용 투여는 이 약 초회량 2.5mg을 1일 2회 투여시 고려할 수 있고, 안정시 심박수가 70회/분 이상인 경우에는 심박수를 모니터링 하면서 병용 투여하는 것을 고려할 수 있다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[② CYP3A4 유도제 : CYP3A4 유도제(예: 리팜피신, 바르비탈산, 페니토인, 세인트존스 워트 (St. John&#39;s Wort, Hypericumperforatum))는 이 약의 노출 및 활성을 감소시킬 수 있다. CYP3A4를 유도하는 약물과 병용 투여하는 경우 이 약의 용량 조절이 요구될 수 있다. 세인트존스 워트와 이 약 10 밀리그램을 1일 2회의 병용 투여는 이 약의 AUC를 반으로 감소시켰다. 이 약 투여 중에는 세인트존스 워트 섭취를 제한하여야 한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[3) 기타의 병용투여]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[약물상호작용을 연구한 결과, 다음의 약물들이 이 약의 약력학 및 약동학에 미치는 영향은 임상적으로 유의하지 않았음을 보여주었다: 프로톤 펌프 저해제(오메프라졸, 란소프라졸), 실데나필, HMG CoA 환원효소 저해제(심바스타틴), 디히드로피린계 칼슘채널차단제(암로디핀, 라시디핀), 디곡신 및 와파린. 또한, 이 약은 심바스타틴, 암로디핀, 라시디핀의 약동학, 디곡신 및 와파린의 약동학 및 약력학, 아스피린의 약동학에 임상적으로 유의한 효과를 나타내지 않았다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[주요 3상 임상시험에서 다음의 약물들은 제한되지 않았고 안전성 문제에 대한 증거없이 이 약과 일상적으로 병용되었다. : 안지오텐신전환효소저해제, 안지오텐신II 길항제, 베타 차단제, 이뇨제, 항알도스테론제, 속효성 및 지속성 니트레이트, HMG CoA 환원효소 저해제, 피브레이트, 프로톤 펌프 저해제, 경구 당뇨병제제, 아스피린 및 기타 항혈소판제제]]&gt;&lt;/PARAGRAPH&gt;
    &lt;/ARTICLE&gt;
    &lt;ARTICLE title=&quot;6. 임부 및 수유부에 대한 투여&quot;&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[1) 가임 여성]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[가임 여성은 치료 기간동안 적절한 피임법을 사용하여야 한다 (‘1. 다음 환자에는 투여하지 말 것’ 항 참조)]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[2) 임부]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[임부에서 이 약의 사용에 대한 적절한 자료는 없다. 동물 생식시험 결과 배 태자 독성 및 최기형성 효과가 나타났다. 사람에서의 잠재적인 위험은 알 수 없으므로 이 약은 임신부에게 투여해서는 안 된다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[3) 수유부]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[동물시험 결과, 이 약은 유즙으로 분비되었다. 따라서 이 약은 수유부에게 투여해서는 안 된다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약의 치료가 필요한 여성은 수유를 중지한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[4) 수태능]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[랫드 시험에서 수컷 및 암컷에서 수태능에 대한 영향을 보이지 않았다.]]&gt;&lt;/PARAGRAPH&gt;
    &lt;/ARTICLE&gt;
    &lt;ARTICLE title=&quot;7. 과량 투여시의 처치&quot;&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[1) 증상]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약의 과량 투여는 중증의 지속적인 서맥을 유발할 수 있다(‘3. 이상반응’항 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[2) 치료]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[중증의 서맥은 전문가에 의해 대증 요법으로 치료한다. 혈액학적 내성이 적은 서맥인 경우, 이소프레날린(isoprenaline)과 같은 베타 흥분제를 정맥주사하는 등의 대증 요법을 고려할 수 있다. 필요하다면 일시적인 심전기조율(cardiac electrical pacing)로 대체할 수 있다.]]&gt;&lt;/PARAGRAPH&gt;
    &lt;/ARTICLE&gt;
    &lt;ARTICLE title=&quot;8. 운전 및 기계 조작에 대한 영향&quot;&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[건강한 피험자를 대상으로 이 약이 운전에 대하여 미칠 수 있는 영향을 평가한 결과, 이 약은 운전 행위에 어떠한 변화도 일으키지 않는다는 것이 입증되었다. 그러나, 시판 후 사용경험에서 시각 증상으로 인해 운전 능력이 손상된 사례가 보고되었다. 이 약은 주로 안내 섬광을 포함한 일시적인 발광 현상을 일으킬 수 있다(3. 이상반응 항 참조). 따라서 빛의 강도의 갑작스러운 변화가 일어날 수 있는 환경, 특히 야간 운전 시 이러한 발광 현상이 발생할 수 있음을 고려한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약은 기계조작 능력에 대해서는 영향을 미치지 않는다.]]&gt;&lt;/PARAGRAPH&gt;
    &lt;/ARTICLE&gt;
    &lt;ARTICLE title=&quot;9. 보관 및 취급상의 주의사항&quot;&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[1) 어린이의 손이 닿지 않는 곳에 보관한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[2) 다른 용기에 바꾸어 넣는 것은 사고 원인이 되거나 품질 유지면에서 바람직하지 않으므로 이를 주의해야 한다. 끝.]]&gt;&lt;/PARAGRAPH&gt;
    &lt;/ARTICLE&gt;

      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[1) 이 약의 구성성분에 대해 과민증이 있는 환자]]&gt;&lt;/PARAGRAPH&gt;

      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[14) 심박수를 감소시키는 중등도의 CYP3A4 억제제인 베라파밀 또는 딜티아젬을 병용투여하는 환자 (‘5. 상호작용’항 참조)]]&gt;&lt;/PARAGRAPH&gt;

      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[&lt;sup&gt;*&lt;/sup&gt; 자발 보고로부터 확인된 이상반응에 대해 임상시험에서 계산된 발생 빈도]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[3) 특정 이상반응]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[발광 현상(안내 섬광)은 환자의 14.5%에서 보고되었으며, 시야의 국한된 부분에서 일시적으로 강해진 밝음으로 설명된다. 이러한 현상은 빛 강도의 갑작스러운 변동에 의해서 보통 유발된다. 또한, 안내 섬광은 후광(halo), 이미지 분해(stroboscopic 또는 kaleidoscopic effects), 유색 섬광(coloured bright lights), 또는 한 개의 물체가 여러 개로 보이는 것(retinal persistency)으로써 설명될 수도 있다. 안내 섬광의 발현은 일반적으로 투여 후 2개월 이내에 발생하며 이후 반복적으로 발생할 수 있다. 안내 섬광의 강도는 대체로 경도 내지 중등도인 것으로 보고되었다. 모든 안내 섬광은 투여 중 또는 투여 종료 후 회복되었으며, 대부분(77.5%)의 경우 투약 기간 중 회복되었다. 안내 섬광과 관련하여 일상생활이 변화하거나 투여를 중단한 환자는 1% 미만이었다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[환자의 3.3%가 특히 투여시작 후 2개월 내지 3개월 이내에 서맥을 보고하였다. 환자의 0.5%는 40 bpm 이하의 중증의 서맥을 경험하였다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[SIGNIFY 임상시험에서 심방세동은 위약군에서 3.8%였고, 이 약을 투여하는 환자에서는 5.3%로 관찰되었다. 40,000명 이상의 환자를 포함하는 최소 3개월동안의 모든 2상/3상 이중눈가림 임상시험의 통합 분석(pooled analysis)에서, 대조군의 심방세동 발생률은 4.08%였고, 이 약을 투여한 환자에서는 4.86%였다. 또한 위험비 (hazard ratio)는 1.26이고, 95% 신뢰구간은 1.15-1.39를 나타내었다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[4) 국내 시판 후 조사 결과]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[가. 국내에서 재심사를 위하여 6년 동안 612명을 대상으로 실시한 시판 후 조사 결과, 이상사례의 발현율은 인과관계와 상관없이 22.71%(139/612명, 총 231건)로 보고되었다. 이 중 중대한 이상사례의 발현율은 8.99%(55/612명, 68건)로 심부전악화 1.96%(12/612명, 13건), 호흡곤란 1.63%(10/612명, 10건), 심방세동 0.82%(5/612명, 5건), 복통 0.33%(2/612명, 3건), 가슴통증, 대변내혈액, 무력증, 사망, 심근병증, 심장정지, 패혈증, 흉막삼출 각 0.33%(2/612명, 2건), 만성폐쇄성기도질환악화 0.16%(1/612명, 2건), 구토, 뇌경색, 당뇨병, 동맥류, 서맥, 심방성빈맥, 심실성빈맥, 심장막삼출, 연하곤란, 위장관출혈, 저칼륨혈증, 저혈압, 질소혈증, 천식, 폐렴, 폐부종, 폐섬유증, 혈종, 호흡곤란악화 각 0.16%(1/612명, 1건)가 보고되었다. 이 약과 인과관계를 배제할 수 없는 중대한 약물이상반응은 1.80%(11/612명, 총 12건)로 심방세동 0.65%(4/612명, 4건), 호흡곤란 0.33%(2/612명, 2건), 서맥, 심방성빈맥, 심부전악화, 심실성빈맥, 호흡곤란악화, 흉막삼출 각 0.16%(1/612명, 1건)가 보고되었다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[예상하지 못한 이상사례의 발현율은 인과관계와 상관없이 13.73%(84/612명, 129건)로 보고되었으며, 심부전악화1.96%(12/612명, 13건), 가슴통증 1.63%(10/612명, 10건), 기침 1.31%(8/612명, 8건), 소화불량 0.82%(5/612명, 5건), 고칼륨혈증, 구토, 상기도감염, 식욕부진, 열, 위식도역류, 흉막삼출 각 0.49%(3/612명, 3건), 저칼륨혈증, 폐부종 각 0.33%(2/612명, 3건), 다리통증, 대변내혈액, 말초부종, 비염, 빈뇨, 사망, 심근병증, 심장정지, 인두염, 저칼슘혈증, 체온감각변화, 패혈증, 폐렴, ALT증가, AST증가 각 0.33%(2/612명, 2건), 다리무력증, 만성폐쇄성기도질환악화 각 0.16%(1/612명, 2건), 갈증, 감각이상, 감각저하, 건성안, 고혈압, 근육통, 관절통, 귀울림, 뇌경색, 당뇨병, 동맥류, 등통증, 만성폐쇄성기도질환, 바이러스감염, 복부비대, 빈혈, 심막염, 심방성빈맥, 심실성빈맥, 심장막삼출, 안검염, 여성형유방, 연하곤란, 위염, 위장관출혈, 저나트륨혈증, 천식, 치질, 체중감소, 핍뇨, 폐섬유증, 혈종 각 0.16%(1/612명, 1건)로 조사되었다. 이 중, 이 약과 인과관계를 배제할 수 없는 예상하지 못한 약물이상반응 발현율은 1.96%(12/612명, 13건)로 가슴통증 0.65%(4/612명, 4건), 소화불량 0.33%(2/612명, 2건), 말초부종, 심방성빈맥, 심부전악화, 심실성빈맥, 위식도역류, 핍뇨, 흉막삼출 각 0.16%(1/612명, 1건)가 보고되었다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[나. 재심사 이상사례 분석평가 결과]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[이 약에 대한 국내 재심사 이상사례 및 자발적 부작용 보고자료를 국내 시판 허가된 모든 의약품을 대상으로 보고된 이상사례 보고자료와 재심사 종료시점에서 통합평가한 결과, 다른 모든 의약품에서 보고된 이상사례에 비해 이 약에서 통계적으로 유의하게 많이 보고된 이상사례 중 새로 확인된 것들은 없었다.]]&gt;&lt;/PARAGRAPH&gt;
    &lt;/ARTICLE&gt;
    &lt;ARTICLE title=&quot;4. 일반적 주의&quot;&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[1) 심박수 측정]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[심박수는 시간이 지남에 따라 크게 변할 수 있으므로, 이 약의 치료 개시 전 또는 이 약 투여 중 용량 조절이 고려되는 환자에서 안정 시 심박수를 측정할 때에는 연속 심박수 측정, 심전도 및 24시간 활동 모니터링(ambulatory 24-hour monitoring)을 고려해야 한다. 이는 또한 심박수가 낮은 환자, 특히 심박수가 분당 50회 미만으로 감소할 때 또는 용량 감량 이후에도 적용된다(‘용법용량’ 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[2) 심장 부정맥 환자]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약은 부정맥의 치료 또는 예방에는 효과적이지 않으며, 빈맥이 발생할 경우 이 약의 유효성이 소실될 가능성도 있다(심실 또는 심실위 빈맥). 따라서, 심방세동이 있거나 동결절(sinus node)의 기능을 저해하는 부정맥이 있는 환자에게 이 약은 권장되지 않는다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약을 투여받는 환자에서 심방세동 발병 위험이 증가한다.(‘3. 이상반응’항 참조). 심방세동은 아미오다론 또는 강력한 class Ⅰ 항부정맥제를 병용 투여한 환자에서 더 흔하게 나타났다. 이 약을 투여받은 환자에게는 심방 세동 발생(지속성 또는 발작성)에 대하여 정기적인 임상 모니터링이 권장되며, 임상적 징후(협심증의 악화, 가슴 두근거림, 불규칙적인 맥박)가 보이는 경우 심전도 모니터링도 실시한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[환자에게는 심방세동의 징후 및 증상에 대해 알려야 하며 이러한 증상 발생 시에 담당의사에게 연락하도록 권고해야 한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[만약 심방세동이 치료 도중 발생한다면, 이 약의 지속적인 투여에 대한 치료의 유익성과 위험성의 균형을 다시 신중히 고려해야 한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[심실내 전도 장애(좌측속지차단, 우측속지차단) 및 심실동기이상이 있는 만성 심부전 환자는 면밀하게 모니터해야 한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[3) 2도 방실차단(AV-block) 환자]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[2도 방실차단(AV-block) 환자에게 이 약이 권장되지 않는다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[4) 심박수가 낮은 환자]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약을 투여하기 전 안정시 심박수가 분당 70회 미만인 환자에게 이 약을 투여해서는 안 된다. (&#39;1. 다음 환자에는 투여하지 말 것&#39;항 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약 투여 중 안정시 심박수가 지속적으로 분당 50회 미만으로 감소하거나, 서맥 증상 (예: 어지러움, 피로, 저혈압 등)이 나타나는 경우 용량을 순차적으로 감량하여야 하며, 분당 50회 미만의 심박수 또는 서맥증상이 지속되는 경우 투여를 중단하여야 한다. (&#39;용법ㆍ용량&#39;항 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[5) 칼슘채널차단제와의 병용투여]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약과 베라파밀 또는 딜티아젬 등 심박수를 감소시키는 칼슘채널차단제를 병용투여해서는 안 된다.(‘1.다음 환자에는 투여하지 말 것’, ‘5.상호작용’ 항 참조). 이 약과 니트레이트 및 암로디핀 등의 디히드로피리딘계 칼슘채널차단제와 병용투여시 안전성 관련 문제가 보고된 바 없다. 디히드로피리딘계 칼슘채널차단제와 병용투여시 이 약의 상가효과는 입증되지 않았다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[6) 만성 심부전]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약은 심부전이 안정 상태일 때에만 투여되어야 한다. 이약은 NYHA Class IV 등급의 심부전 환자에서의 정보가 제한적이므로 주의하여 사용하여야 한다. 만성 심부전 환자 6,505명을 대상으로 한 연구 (SHIFT 연구)에서 기저치 심박수가 높을수록, 병용투여한 베타차단제의 용량이 낮을수록 이 약의 효과가 증가하였다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[7) 뇌졸중 환자]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[뇌졸중에 대한 유용한 자료가 없으므로, 뇌졸중이 일어난 직후 이 약을 투여하는 것은 권장하지 않는다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[8) 시각 기능]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약은 망막 기능에 영향을 미친다. 아직 이 약의 망막에 대한 독성 작용을 입증하는 증거는 없으나 이 약으로 1년 이상 장기 투여 시 망막 기능에 대한 작용은 현재까지 알려져 있지 않다. 예상하지 못한 시각 기능 저하가 발생할 경우 투여 중단을 고려한다. 이 약을 망막색소변성이 있는 환자에게 투여시 주의하여야 한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[9) 저혈압 환자]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[경증 또는 중등증의 저혈압 환자에 대한 연구 자료가 제한적이므로, 이 약을 주의하여 투여해야 한다. 중증의 저혈압 환자(혈압이 90/50mmHg 미만)에 이 약을 투여해서는 안 된다 (1. 다음 환자에는 투여하지 말 것 항 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[10) 심방 세동-심장 부정맥]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약을 투여 받은 환자에서 약리학적 심장율동전환(cardioversion)가 시작되었을 때 동리듬(sinus rhythm) 회복 시 (과다한) 서맥의 위험에 관한 증거는 없다. 광범위한 자료는 없으나, 이 약의 최종 투여 후 24시간 동안 긴급하지 않은 직접적인 전류의 심장율동전환(non urgent DC-cardioverson)이 발생하는 것을 고려한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[11) 선천성 QT증후군 또는 QT 연장 약물을 투여하는 환자]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약은 선천성 QT 증후군이 있거나 QT 연장 약물을 투여하는 환자에게는 사용하지 않는다(&#39;5. 상호작용&#39; 항 참조). 병용투여가 필요한 경우, 면밀한 심장 모니터링이 필요하다. 이 약으로 인한 심박수 감소는 QT 연장을 더욱 악화시킬 수 있으며, 특히 Torsade de pointes에서 중증의 부정맥을 발생시킬 수 있다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[12) 혈압 치료제 변경을 요하는 고혈압 환자]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[SHIFT 임상시험에서 위약(6.1%)을 투여한 환자와 비교하여 이 약(7.1%)을 투여하는 동안 더 많은 환자가 혈압 증가 사례를 경험하였다. 이들 사례는 혈압 치료제가 변경된 직후 가장 빈번하게 발생하였고, 일시적이었으며, 이 약의 치료 효과에 영향을 미치지 않았다. 이 약을 투여하는 만성 심부전 환자에서 치료제를 변경할 때는 적절한 간격으로 혈압을 모니터해야 한다(사용상의 주의사항 중 3. 이상반응 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[13) 이 약은 만성심부전에 대한 치료경험이 많은 의사를 통해 사용되는 것이 권장된다.]]&gt;&lt;/PARAGRAPH&gt;
    &lt;/ARTICLE&gt;
    &lt;ARTICLE title=&quot;5. 상호작용&quot;&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[1) 약력학적 상호작용]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[가. 병용투여가 권장되지 않는 약물]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;2&quot;&gt;&lt;![CDATA[① QT를 연장시키는 약물]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;3&quot;&gt;&lt;![CDATA[- 심혈관성 QT 연장 약물(예: 퀴니딘, 디소피라미드, 베프리딜, 소타롤, 이부틸라이드, 아미오다론)]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;3&quot;&gt;&lt;![CDATA[- 비 심혈관성 QT 연장 약물(예: 피모지드, 지프라시돈, 세틴돌, 메플로퀸, 할로판드린, 펜타미딘, 시사프라이드, 정주용 에리트로마이신)]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;3&quot;&gt;&lt;![CDATA[심박수 감소로 QT 연장이 악화될 수 있으므로 심혈관성 및 비심혈관성 QT 연장 약물과 이 약의 병용 투여를 피한다. 병용 투여가 필요한 경우에는 정밀한 심장 모니터링이 필요하다(&#39;3. 이상반응&#39;항 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[나. 병용투여시 주의가 필요한 약물]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[칼륨고갈성이뇨제(티아지드계 이뇨제 및 루프성 이뇨제):저칼륨혈증은 부정맥의 위험성을 증가시킬 수 있다. 이 약은 서맥을 유발할 수 있으므로, 저칼륨혈증과 서맥이 동반되면 중증의 부정맥 발생을 초래할 수 있다. 선천성인지 혹은 물질에 의해 유도되었는지에 관계없이 QT 증후군 환자에서 위험성이 증가한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[2) 약동학적 상호작용]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[가. 사이토크롬 P450 3A4(CYP3A4)]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[이 약은 CYP3A4에 의해서만 대사되며, 이 효소의 매우 약한 저해제이다. 이 약은 CYP3A4의 다른 기질 약물들(경미하거나, 중등도 및 강력한 저해제 모두 포함)의 대사 및 혈장농도에 영향을 미치지 않았다. CYP3A4 저해제 및 유도제들은 이 약과 임상적으로 유의한 수준의 상호작용을 나타내어 이 약의 대사 및 약동학에 영향을 미친다. 약물상호작용에 대한 연구는 CYP3A4 저해제가 이 약의 혈장농도를 증가시키고 CYP3A4 유도제들은 이 약의 혈중농도를 감소시킴이 보고되었다. 이 약의 증가된 혈중 농도는 과도한 서맥의 위험과 관련될 수 있다(&#39;3. 이상반응&#39;항 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[나. 병용 투여 금기인 약물]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[이 약은 아졸계 항진균제(케토코나졸, 이트라코나졸), 마크로라이드계 항생제(클래리트로마이신, 에리트로마이신, 조사마이신, 텔리트로마이신), HIV 단백분해효소 저해제(넬피나비르, 리토나비르)와 같은 강력한 CYP3A4 억제제 및 네파조돈과 병용 투여해서는 안 된다(&#39;1. 다음 환자에는 투여하지 말 것&#39;항 참조). 강력한 CYP3A4 저해제인 케토코나졸 (1일 1회 200 밀리그램 투여) 및 조사마이신(1일 2회 1그램 투여)은 이 약의 평균 혈장 농도를 7~8배 증가시켰다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[중등도의 CYP3A4 저해제 : 건강한 피험자 및 환자를 대상으로 약물상호작용 연구한 결과, 심박수를 감소시키는 약물인 딜티아젬 또는 베라파밀과 이 약을 병용 투여하는 경우, 이 약의 혈중 약물 농도가 증가되었으며(AUC의 2~3배 증가), 심박수 5 bpm이 추가로 감소되었다. 따라서, 이러한 약물들과 이 약을 병용투여해서는 안 된다. (‘1. 다음 환자에 투여하지 말 것’항 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[다. 병용투여가 권장되지 않는 약물]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[자몽주스: 이 약을 자몽주스와 동시에 복용 시 이 약의 노출이 2배 증가하였다. 따라서 자몽주스의 섭취를 피해야 한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[라. 병용투여시 주의가 필요한 약물]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;2&quot;&gt;&lt;![CDATA[① 중등도의 CYP3A4 저해제: 다른 중등도의 CYP3A4 저해제(예: 플루코나졸)와 이 약의 병용 투여는 이 약 초회량 2.5mg을 1일 2회 투여시 고려할 수 있고, 안정시 심박수가 70회/분 이상인 경우에는 심박수를 모니터링 하면서 병용 투여하는 것을 고려할 수 있다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;2&quot;&gt;&lt;![CDATA[② CYP3A4 유도제 : CYP3A4 유도제(예: 리팜피신, 바르비탈산, 페니토인, 세인트존스 워트 (St. John&#39;s Wort, Hypericumperforatum))는 이 약의 노출 및 활성을 감소시킬 수 있다. CYP3A4를 유도하는 약물과 병용 투여하는 경우 이 약의 용량 조절이 요구될 수 있다. 세인트존스 워트와 이 약 10 밀리그램을 1일 2회의 병용 투여는 이 약의 AUC를 반으로 감소시켰다. 이 약 투여 중에는 세인트존스 워트 섭취를 제한하여야 한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[마. 기타의 병용투여]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[약물상호작용을 연구한 결과, 다음의 약물들이 이 약의 약력학 및 약동학에 미치는 영향은 임상적으로 유의하지 않았음을 보여주었다: 프로톤 펌프 저해제(오메프라졸, 란소프라졸), 실데나필, HMG CoA 환원효소 저해제(심바스타틴), 디히드로피린계 칼슘채널차단제(암로디핀, 라시디핀), 디곡신 및 와파린. 또한, 이 약은 심바스타틴, 암로디핀, 라시디핀의 약동학, 디곡신 및 와파린의 약동학 및 약력학, 아스피린의 약동학에 임상적으로 유의한 효과를 나타내지 않았다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;0&quot; marginLeft=&quot;1&quot;&gt;&lt;![CDATA[주요 3상 임상시험에서 다음의 약물들은 제한되지 않았고 안전성 문제에 대한 증거없이 이 약과 일상적으로 병용되었다. : 안지오텐신전환효소저해제, 안지오텐신II 길항제, 베타 차단제, 이뇨제, 항알도스테론제, 속효성 및 지속성 니트레이트, HMG CoA 환원효소 저해제, 피브레이트, 프로톤 펌프 저해제, 경구 당뇨병제제, 아스피린 및 기타 항혈소판제제]]&gt;&lt;/PARAGRAPH&gt;
    &lt;/ARTICLE&gt;
    &lt;ARTICLE title=&quot;6. 임부 및 수유부에 대한 투여&quot;&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[1) 가임 여성]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[가임 여성은 치료 기간동안 적절한 피임법을 사용하여야 한다 (‘1. 다음 환자에는 투여하지 말 것’ 항 참조)]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[2) 임부]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[임부에서 이 약의 사용에 대한 적절한 자료는 없다. 동물 생식시험 결과 배 태자 독성 및 최기형성 효과가 나타났다. 사람에서의 잠재적인 위험은 알 수 없으므로 이 약은 임신부에게 투여해서는 안 된다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[3) 수유부]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[동물시험 결과, 이 약은 유즙으로 분비되었다. 따라서 이 약은 수유부에게 투여해서는 안 된다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약의 치료가 필요한 여성은 수유를 중지해야 한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[4) 수태능]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[랫드 시험에서 수컷 및 암컷에서 수태능에 대한 영향을 보이지 않았다.]]&gt;&lt;/PARAGRAPH&gt;
    &lt;/ARTICLE&gt;
    &lt;ARTICLE title=&quot;7. 과량 투여시의 처치&quot;&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[1) 증상]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약의 과량 투여는 중증의 지속적인 서맥을 유발할 수 있다(‘3. 이상반응’항 참조).]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[2) 치료]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[중증의 서맥은 전문가에 의해 대증 요법으로 치료한다. 혈액학적 내성이 적은 서맥인 경우, 이소프레날린(isoprenaline)과 같은 베타 흥분제를 정맥주사하는 등의 대증 요법을 고려할 수 있다. 필요하다면 일시적인 심전기조율(cardiac electrical pacing)로 대체할 수 있다.]]&gt;&lt;/PARAGRAPH&gt;
    &lt;/ARTICLE&gt;
    &lt;ARTICLE title=&quot;8. 운전 및 기계 조작에 대한 영향&quot;&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[건강한 피험자를 대상으로 이 약이 운전에 대하여 미칠 수 있는 영향을 평가한 결과, 이 약은 운전 행위에 어떠한 변화도 일으키지 않는다는 것이 입증되었다. 그러나, 시판 후 사용경험에서 시각 증상으로 인해 운전 능력이 손상된 사례가 보고되었다. 이 약은 주로 안내 섬광을 포함한 일시적인 발광 현상을 일으킬 수 있다(3. 이상반응 항 참조). 따라서 빛의 강도의 갑작스러운 변화가 일어날 수 있는 환경, 특히 야간 운전 시 이러한 발광 현상이 발생할 수 있음을 고려한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[이 약은 기계조작 능력에 대해서는 영향을 미치지 않는다.]]&gt;&lt;/PARAGRAPH&gt;
    &lt;/ARTICLE&gt;
    &lt;ARTICLE title=&quot;9. 보관 및 취급상의 주의사항&quot;&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[1) 어린이의 손이 닿지 않는 곳에 보관한다.]]&gt;&lt;/PARAGRAPH&gt;
      &lt;PARAGRAPH tagName=&quot;p&quot; textIndent=&quot;&quot; marginLeft=&quot;&quot;&gt;&lt;![CDATA[2) 다른 용기에 바꾸어 넣는 것은 사고 원인이 되거나 품질 유지면에서 바람직하지 않으므로 이를 주의해야 한다. 끝.]]&gt;&lt;/PARAGRAPH&gt;
    &lt;/ARTICLE&gt;
