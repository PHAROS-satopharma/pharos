# Cloudflare Email Worker for the PV mailbox newsletter aliases.
# Deployed by .github/workflows/deploy-worker.yml; secrets are uploaded by that workflow from GitHub secrets:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, FORWARD_TO (optional)
name = "pharos-email-inbound"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false

[vars]
# recipient alias (the part before @) = source id in collectors/sources.yaml
ALIAS_SOURCES = "fimea=fimea-email,tga=tga-email"
# source id = its From domains (| between them), as options.from_domains in collectors/sources.yaml. A message
# reaches its source only from these domains and with the receiving server's DMARC, DKIM or SPF pass for one.
SOURCE_DOMAINS = "fimea-email=fimea.fi,tga-email=tga.gov.au|health.gov.au"

[[r2_buckets]]
binding = "ARCHIVE"
# Must equal the R2_BUCKET secret (docs/setup.md, step 5).
bucket_name = "pharos-archive"

[observability]
enabled = true
