# PHAROS source catalogue. Synced into regulator + source on every run (origin = catalogue).
# Built from links verified live on 2026-11-04 — never from the Word file, whose links are partly
# broken or misdirected. Sources a person adds in the app (origin = user) are never touched.
#
# Per source:
#   kind      safety | recall | spc | literature
#   channel   rss | atom | json | api | html | browser | email
#   schedule  4h | 12h | daily | weekly | monthly
#   parser    module under collectors/parsers (spc: collectors/spc)
#   expected_max_gap_days   quiet longer than this → health 'degraded'
#   options   parser options (documented at the top of each parser); runner-level keys:
#             detail: always | matched_only | never   (when to call fetch_detail)
#             backfill_all: true                       (backfill keeps the whole history)
#   enabled   only applied when the row is first created; afterwards an admin decides in the app.

