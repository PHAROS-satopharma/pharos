sources:
  # ───────────── EMA (anchors) ─────────────
  - id: ema-dhpc
    regulator: EMA
    kind: safety
    channel: json
    url: https://www.ema.europa.eu/en/documents/report/dhpc-output-json-report_en.json
    parser: ema_dhpc
    languages: [en]
    schedule: 4h
    expected_max_gap_days: 45
    options: {backfill_all: true, categories: [Human]}

  - id: ema-psusa
    regulator: EMA
    kind: safety
    channel: json
    url: https://www.ema.europa.eu/en/documents/report/medicines-output-periodic_safety_update_report_single_assessments-output-json-report_en.json
    parser: ema_psusa
    languages: [en]
    schedule: daily
    expected_max_gap_days: 45
    options: {backfill_all: true, detail: matched_only, categories: [Human]}

  # ───────────── United States ─────────────
  - id: fda-medwatch
    regulator: FDA
    kind: safety
    channel: rss
    url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/medwatch/rss.xml
    parser: feed
    enabled: false
    notes: "Off: FDA refuses GitHub's servers (abuse-detection page); MedWatch is read from its e-mail list (fda-email)."
    languages: [en]
    schedule: 4h
    expected_max_gap_days: 21
    options:
      doc_type: safety_alert
      doc_type_rules:
        - {keyword: recall, doc_type: recall}
        - {keyword: "drug safety communication", doc_type: safety_update}
      exclude_url_patterns: [/medical-devices/]
      body_selector: "article"

  - id: fda-enforcement
    regulator: FDA
    kind: recall
    channel: api
    url: https://api.fda.gov/drug/enforcement.json
    parser: openfda_enforcement
    languages: [en]
    schedule: daily
    expected_max_gap_days: 21
    options: {lookback_days: 45, page_size: 100}

  # ───────────── United Kingdom ─────────────
  - id: mhra-dsu
    regulator: MHRA
    kind: safety
    channel: atom
    url: https://www.gov.uk/drug-safety-update.atom
    parser: govuk
    languages: [en]
    schedule: 4h
    expected_max_gap_days: 60
    options: {doc_type: safety_update}

  - id: mhra-alerts
    regulator: MHRA
    kind: safety
    channel: atom
    url: https://www.gov.uk/drug-device-alerts.atom
    parser: govuk
    languages: [en]
    schedule: 4h
    expected_max_gap_days: 30
    options:
      doc_type: safety_alert
      doc_type_rules:
        - {keyword: "medicines recall", doc_type: recall}
        - {keyword: "field safety notices", doc_type: other}

  # ───────────── Germany ─────────────
  - id: bfarm-rhb
    regulator: BFARM
    kind: safety
    channel: rss
    url: https://www.bfarm.de/SiteGlobals/Functions/RSSFeed/DE/Pharmakovigilanz/Rote-Hand-Briefe/RSSNewsfeed.xml?nn=591002
    parser: feed
    languages: [de]
    schedule: 4h
    expected_max_gap_days: 45
    notes: German feed (the English one is …/RSSFeed/EN/Rote-Hand-Briefe/RSSNewsfeed.xml?nn=702260).
    options:
      doc_type: dhpc
      doc_type_rules:
        - {keyword: Informationsbrief, doc_type: safety_alert}
      body_selector: "#content"
      attachment_patterns: ["blob=publicationfile", ".pdf"]

  - id: bfarm-risk
    regulator: BFARM
    kind: safety
    channel: html
    url: https://www.bfarm.de/DE/Arzneimittel/Pharmakovigilanz/Risikoinformationen/Risikobewertungsverfahren/_node.html
    parser: bfarm_risk
    languages: [de]
    schedule: 4h
    expected_max_gap_days: 30
    notes: The three German lists (checked 5 Nov 2026); the English search page has no table.
    options:
      extra_urls:
        - https://www.bfarm.de/DE/Arzneimittel/Pharmakovigilanz/Risikoinformationen/Weitere-Arzneimittelrisiken/_node.html
        - https://www.bfarm.de/DE/Arzneimittel/Pharmakovigilanz/Risikoinformationen/Aufforderung-zur-Textanpassung/_node.html

  # ───────────── Austria ─────────────
  - id: basg-whatsnew
    regulator: BASG
    kind: safety
    channel: rss
    url: https://www.basg.gv.at/whatsnew/rss
    parser: feed
    languages: [de]
    schedule: 4h
    expected_max_gap_days: 30
    options:
      doc_type: safety_alert
      include_url_patterns: [/marktbeobachtung/amtliche-nachrichten/, /gesundheitsberufe/]
      exclude_keywords: ["West Nil", "Dengue", "Chikungunya", "Malaria", "Medizinprodukte"]
      doc_type_rules:
        - {keyword: Rückruf, doc_type: recall}
        - {keyword: Chargenrückruf, doc_type: recall}
        - {keyword: DHPC, doc_type: dhpc}
        - {keyword: "Meeting Highlights", doc_type: newsletter}
        - {keyword: "RMS NEWS", doc_type: newsletter}

  # ───────────── Spain ─────────────
  - id: aemps-feed
    regulator: AEMPS
    kind: safety
    channel: rss
    url: https://www.aemps.gob.es/feed/
    parser: feed
    languages: [es]
    schedule: 4h
    expected_max_gap_days: 30
    notes: Connection is slow from some networks; the 40 s timeout is usually enough.
    options:
      doc_type: safety_alert
      include_categories: [Seguridad, Medicamentos Uso Humano, Defectos de calidad, Medicamentos ilegales, Boletín Mensual FV]
      exclude_keywords: [veterinari, cosmétic]
      doc_type_rules:
        - {category: Defectos de calidad, doc_type: recall}
        - {category: Boletín Mensual FV, doc_type: newsletter}
      body_selector: "article"

  # ───────────── Singapore ─────────────
  - id: hsa-announcements
    regulator: HSA
    kind: safety
    channel: rss
    url: https://www.hsa.gov.sg/announcements/rss.xml
    parser: feed
    languages: [en]
    schedule: 4h
    expected_max_gap_days: 30
    options:
      include_categories: [Dear Healthcare Professional Letters, Product Recalls, Safety Alerts, Adverse Drug Reaction News Bulletins]
      doc_type_rules:
        - {category: Dear Healthcare Professional Letters, doc_type: dhpc}
        - {category: Product Recalls, doc_type: recall}
        - {category: Adverse Drug Reaction News Bulletins, doc_type: newsletter}
      doc_type: safety_alert

  # ───────────── Canada ─────────────
  - id: hc-recalls
    regulator: HC
