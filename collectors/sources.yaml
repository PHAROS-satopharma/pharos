    schedule: 4h
    expected_max_gap_days: 21
    notes: >-
      fda.gov answers GitHub's servers with its abuse-detection page, so the MedWatch Safety Alerts
      e-mail list (sent through GovDelivery) is read from the mailbox instead.
    options: {from_domains: [fda.gov, public.govdelivery.com], web_domain: fda.gov}

