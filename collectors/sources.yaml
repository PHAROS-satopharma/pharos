  # ───────────── Email ingestion (pharos@satopharma.com) ─────────────
  - id: fimea-email
    regulator: FIMEA
    kind: safety
    channel: email
    url: https://fimea.fi/ajankohtaista/laaketurvallisuustiedotteet
    parser: email_inbox
    languages: [fi, sv]
    schedule: 4h
    expected_max_gap_days: 60
    notes: Fimea's web pages sit behind a Cloudflare check that is never bypassed; its newsletter is read from the mailbox instead.
    options: {from_domains: [fimea.fi]}

  - id: tga-email
    regulator: TGA
    kind: safety
    channel: email
    url: https://www.tga.gov.au/news/safety-alerts
    parser: email_inbox
    languages: [en]
    schedule: 4h
    expected_max_gap_days: 60
    notes: >-
      TGA cuts the connection from datacenter addresses, so its Safety Information notifications are read
      from the mailbox. They are sent through the Department of Health's Swift Digital portal
      (tgacomms.health.gov.au), hence health.gov.au.
    options: {from_domains: [tga.gov.au, health.gov.au]}

  - id: fda-email
