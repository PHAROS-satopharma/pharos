# PHAROS — Supabase project settings (owner: platform).
# Used by the Supabase CLI in deploy-supabase.yml (db push, functions deploy). The live project is linked by
# SUPABASE_PROJECT_REF; nothing secret lives in this file.
#
# The sign-in rules below are ALSO set once by hand in the dashboard (docs/setup.md, step 12), because the
# deploy does not push auth settings: invite-only, no public sign-up.

project_id = "pharos"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[storage]
enabled = false

[auth]
enabled = true
# Replaced in the dashboard with the real Cloudflare Pages address (docs/setup.md).
site_url = "https://pharos-satopharma.pages.dev"
additional_redirect_urls = ["https://pharos-satopharma.pages.dev/**", "http://localhost:5173/**"]
# One hour access tokens, rotated refresh tokens.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Invite-only: nobody can create an account; an admin invites each person (invite-person function).
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
# Email magic link and email + password both work; neither can create a new account.
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false

[auth.external.apple]
enabled = false

[auth.external.google]
enabled = false

[auth.external.azure]
enabled = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# Every function checks the signed-in person itself; the gateway check is a second lock.
[functions.ingredient-lookup]
verify_jwt = true

[functions.probe-source]
verify_jwt = true

[functions.archive-url]
verify_jwt = true

[functions.invite-person]
verify_jwt = true

[functions.literature-search]
verify_jwt = true

[functions.case-intake]
verify_jwt = true

# Telegram cannot send a Supabase token; the function checks X-Telegram-Bot-Api-Secret-Token instead.
[functions.telegram-webhook]
verify_jwt = false
